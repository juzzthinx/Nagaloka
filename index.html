<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NAGALOKA — THE SERPENT REMEMBERS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@400;600;800&family=Share+Tech+Mono&display=swap');
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{width:100%;height:100%;overflow:hidden;background:#020806;color:#d9e5cf;font-family:'Share Tech Mono',monospace}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#game{position:fixed;inset:0;overflow:hidden}
#intro{position:fixed;inset:0;z-index:1000;background:#020604;overflow:hidden;transition:opacity 1.4s ease,filter 1.4s ease}
#intro.hide{opacity:0;filter:brightness(2) blur(8px);pointer-events:none}
#introSky{position:absolute;inset:0;background:radial-gradient(circle at 72% 28%,rgba(190,220,164,.18),transparent 8%),linear-gradient(#020a08 0%,#06130f 48%,#020604 100%)}
#moon{position:absolute;width:160px;height:160px;right:14%;top:13%;border-radius:50%;background:radial-gradient(circle at 38% 34%,#f0ead1,#aaa98c 52%,#696b58 75%,transparent 76%);box-shadow:0 0 30px rgba(220,232,180,.16),0 0 100px rgba(170,205,150,.09);opacity:.86}
#introJungle{position:absolute;left:0;right:0;bottom:0;height:58%;background:linear-gradient(transparent 0%,rgba(1,7,5,.15) 15%,rgba(1,5,4,.96) 75%),repeating-linear-gradient(82deg,transparent 0 22px,rgba(1,4,3,.9) 23px 31px,transparent 32px 52px);clip-path:polygon(0 55%,3% 48%,6% 56%,10% 39%,13% 54%,17% 45%,21% 57%,26% 38%,30% 51%,35% 42%,39% 58%,44% 37%,49% 51%,54% 42%,59% 55%,64% 35%,69% 50%,74% 40%,79% 54%,84% 37%,89% 51%,94% 41%,100% 52%,100% 100%,0 100%)}
#serpentSilhouette{position:absolute;left:10%;bottom:26%;width:78%;height:18%;opacity:0;transition:opacity 2s ease}
#serpentSilhouette.show{opacity:.72}
#serpentSilhouette:before{content:"";position:absolute;left:5%;top:52%;width:88%;height:22px;border-radius:50%;background:#010302;box-shadow:50px -15px 0 -5px #010302,110px 8px 0 -4px #010302,180px -12px 0 -6px #010302,270px 7px 0 -5px #010302,350px -8px 0 -4px #010302,440px 6px 0 -6px #010302;transform:rotate(-3deg)}
#serpentSilhouette:after{content:"";position:absolute;right:0;top:22%;width:65px;height:70px;background:#010302;clip-path:polygon(0 70%,15% 25%,40% 5%,68% 25%,100% 75%,62% 64%,35% 100%)}
.vhs{position:absolute;inset:0;pointer-events:none}
.vhs:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.025) 0,rgba(255,255,255,.025) 1px,transparent 2px,transparent 5px);opacity:.7}
.vhs:after{content:"";position:absolute;left:-10%;width:120%;height:18px;top:35%;background:rgba(220,255,220,.045);box-shadow:0 140px rgba(220,255,220,.025),0 300px rgba(220,255,220,.03);animation:tracking 7s linear infinite}
@keyframes tracking{0%{transform:translateY(-100px)}100%{transform:translateY(100vh)}}
#introUI{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding-top:4vh}
#archive{font-size:10px;letter-spacing:5px;opacity:.6;margin-bottom:18px}
#title{font-family:'Big Shoulders Stencil Display',sans-serif;font-size:clamp(55px,13vw,130px);line-height:.78;letter-spacing:8px;color:#d9e4bd;text-shadow:0 0 8px rgba(200,235,160,.25),4px 4px 0 rgba(0,0,0,.65)}
#subtitle{margin-top:18px;font-size:clamp(12px,2vw,18px);letter-spacing:7px;color:#9da98d}
#tagline{margin-top:32px;font-size:11px;letter-spacing:4px;color:#b8c9a7;min-height:16px}
#date{position:absolute;left:22px;top:20px;font-size:10px;line-height:1.8;color:#aab89a;opacity:.65;text-align:left}
#rec{position:absolute;right:22px;top:20px;font-size:10px;color:#b3c59d;letter-spacing:2px}
#rec i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#a8c478;margin-right:5px;animation:blink .8s infinite}
@keyframes blink{50%{opacity:.15}}
#signal{margin-top:35px;width:min(420px,72vw);height:4px;background:rgba(180,210,150,.08);overflow:hidden}
#signalBar{width:0%;height:100%;background:#9eb67d;box-shadow:0 0 12px rgba(170,210,130,.4)}
#enter{margin-top:28px;border:1px solid rgba(180,210,150,.32);background:rgba(4,13,9,.48);color:#d8e7c4;padding:14px 30px;font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:4px;cursor:pointer;transition:.2s;animation:enterPulse 2s infinite}
#enter:hover{background:rgba(180,210,150,.12);border-color:#c0d99c}
@keyframes enterPulse{50%{box-shadow:0 0 25px rgba(170,210,130,.05)}}
#loadingText{margin-top:14px;font-size:9px;color:#78866e;letter-spacing:2px}
#glitch{position:absolute;inset:0;opacity:0;background:rgba(210,255,210,.05);pointer-events:none}
#glitch.on{animation:glitch .18s steps(2)}
@keyframes glitch{0%{opacity:1;transform:translateX(-8px)}50%{opacity:.3;transform:translateX(12px)}100%{opacity:0;transform:translateX(0)}}
#hud{position:fixed;inset:0;z-index:20;pointer-events:none}
#topLeft{position:absolute;left:18px;top:16px;font-size:11px;line-height:1.8;letter-spacing:2px;text-shadow:0 1px 4px #000}
#location{color:#bdcea9}
#status{color:#687b61}
#vitals{position:absolute;left:18px;bottom:22px;width:190px}
#vitalText{font-size:10px;letter-spacing:2px;margin-bottom:5px}
#hpBar{height:5px;width:100%;background:rgba(255,255,255,.08)}
#hp{height:100%;width:100%;background:#9db67b;transition:width .2s}
#ammo{position:absolute;right:20px;bottom:20px;text-align:right}
#mag{font-family:'Big Shoulders Stencil Display',sans-serif;font-size:38px;letter-spacing:2px}
#ammo small{font-size:9px;letter-spacing:2px;color:#819077}
#message{position:absolute;left:50%;top:17%;transform:translateX(-50%);text-align:center;font-size:11px;letter-spacing:4px;color:#d4dfbd;opacity:0;transition:opacity .4s;text-shadow:0 0 10px #000}
#message.show{opacity:1}
#scope{position:absolute;inset:0;display:none;background:radial-gradient(circle at center,transparent 0 28%,rgba(0,0,0,.04) 29%,rgba(0,0,0,.77) 48%,rgba(0,0,0,.96) 69%)}
#scope.on{display:block}
#scope:before,#scope:after{content:"";position:absolute;background:rgba(180,220,150,.5)}
#scope:before{left:50%;top:15%;bottom:15%;width:1px}
#scope:after{top:50%;left:15%;right:15%;height:1px}
#scopeDot{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:#d6e7b7;box-shadow:0 0 8px #d6e7b7}
#scopeData{position:absolute;left:50%;top:55%;transform:translateX(-50%);font-size:9px;letter-spacing:2px;color:#b7cba1;white-space:nowrap}
#crosshair{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:rgba(210,225,190,.7)}
#crosshair:before{left:9px;top:0;width:2px;height:20px}
#crosshair:after{left:0;top:9px;width:20px;height:2px}
.touch{position:fixed;z-index:30}
#movePad{left:18px;bottom:75px;width:125px;height:125px;border:1px solid rgba(200,230,180,.12);border-radius:50%;background:rgba(0,0,0,.08);pointer-events:auto}
#moveKnob{position:absolute;width:45px;height:45px;left:40px;top:40px;border-radius:50%;border:1px solid rgba(200,230,180,.18);background:rgba(170,210,140,.05);pointer-events:none}
#lookPad{right:0;top:0;width:50%;height:70%;pointer-events:auto}
.btn{position:fixed;z-index:35;width:54px;height:54px;border-radius:50%;border:1px solid rgba(205,225,185,.2);background:rgba(0,0,0,.22);color:#d2dfbd;font:10px 'Share Tech Mono';letter-spacing:1px;pointer-events:auto}
#fire{right:26px;bottom:90px;width:74px;height:74px}
#aim{right:110px;bottom:130px}
#jump{right:32px;bottom:180px}
#reload{right:115px;bottom:205px}
#torch{right:155px;bottom:75px}
@media(min-width:800px){.btn,.touch{display:none}}
#damage{position:fixed;inset:0;z-index:40;pointer-events:none;opacity:0;background:radial-gradient(circle,transparent 35%,rgba(120,20,10,.35));transition:opacity .1s}
</style>
</head>
<body>
<div id="game"></div>

<div id="intro">
  <div id="introSky"></div><div id="moon"></div><div id="introJungle"></div><div id="serpentSilhouette"></div>
  <div id="date">ARCHIVE TAPE 07<br>LOCATION : NAGALOKA<br>FORMAT : VHS / 4:3 TRANSFER</div>
  <div id="rec"><i></i>REC&nbsp;&nbsp;02:17:43</div>
  <div id="introUI">
    <div id="archive">EXPEDITION RECORD / CLASSIFIED</div>
    <div id="title">NAGALOKA</div>
    <div id="subtitle">〜 REALM OF THE SERPENT 〜</div>
    <div id="tagline">SIGNAL LOCKED</div>
    <div id="signal"><div id="signalBar"></div></div>
    <button id="enter">▸ ENTER THE JUNGLE</button>
    <div id="loadingText">INITIALISING EXPEDITION TAPE...</div>
  </div>
  <div class="vhs"></div><div id="glitch"></div>
</div>

<div id="hud">
  <div id="topLeft"><div id="location">NAGALOKA • 0 m</div><div id="status">THE FOREST IS WATCHING</div></div>
  <div id="message"></div>
  <div id="vitals"><div id="vitalText">VITALITY</div><div id="hpBar"><div id="hp"></div></div></div>
  <div id="ammo"><div id="mag">12 / 48</div><small>7.62 EXPEDITION RIFLE</small></div>
  <div id="scope"><div id="scopeDot"></div><div id="scopeData">RANGE 40m • DROP 0.0 • WIND 0.0</div></div>
  <div id="crosshair"></div>
</div>
<div id="damage"></div>

<div id="movePad" class="touch"><div id="moveKnob"></div></div>
<div id="lookPad" class="touch"></div>
<button id="fire" class="btn">FIRE</button>
<button id="aim" class="btn">AIM</button>
<button id="jump" class="btn">JUMP</button>
<button id="reload" class="btn">RLD</button>
<button id="torch" class="btn">UV</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* NAGALOKA — THE SERPENT REMEMBERS — PERFORMANCE EDITION v2 */
const $=id=>document.getElementById(id);
const game=$('game');
let scene,camera,renderer,sky;
const clock=new THREE.Clock();
let running=false,scoped=false,player,rifle;
let creatures=[],bullets=[],vegetation=[];
let yaw=0,pitch=0,moveX=0,moveY=0,lastLookX=0,lastLookY=0,lookActive=false;
const keys={};
let hp=100,ammo=12,reserve=48,cooldown=0,recoil=0,stamina=100,uv=100,score=0,kills=0;
let boss=null,bossActive=false,bossHP=1000,quality=2;
const WATER=-3,G=9.8,BULLET_SPEED=170,WIND=.55;
const moonDirection=new THREE.Vector3(-.48,.72,-.52).normalize();
const VEC1=new THREE.Vector3(),VEC2=new THREE.Vector3(),VEC3=new THREE.Vector3();
const dummy=new THREE.Object3D();
const ZERO=new THREE.Matrix4().makeScale(0,0,0);

/* ================= INTRO ================= */
const intro=$('intro'),signalBar=$('signalBar'),loadingText=$('loadingText'),serpentSilhouette=$('serpentSilhouette'),glitch=$('glitch');
const introMessages=['CHECKING MAGNETIC COMPASS...','TUNING THE GAMELAN...','RESTORING EXPEDITION AUDIO...','GROWING THE JUNGLE...','SEARCHING FOR THE SERPENT...','THE SERPENT IS REMEMBERING.'];
let loadProgress=0;
function introLoad(){
  loadProgress=Math.min(100,loadProgress+Math.random()*2.5+.7);
  signalBar.style.width=loadProgress+'%';
  loadingText.textContent=introMessages[Math.min(introMessages.length-1,Math.floor(loadProgress/18))];
  if(loadProgress>63)serpentSilhouette.classList.add('show');
  if(Math.random()<.07){glitch.classList.remove('on');void glitch.offsetWidth;glitch.classList.add('on')}
  if(loadProgress<100)setTimeout(introLoad,55);
  else loadingText.textContent='TAPE READY • PRESS TO ENTER';
}
setTimeout(introLoad,350);
$('enter').addEventListener('click',startGame);
$('enter').addEventListener('touchstart',startGame,{passive:false});
function startGame(e){
  if(e)e.preventDefault();
  if(running)return;
  init();
  intro.classList.add('hide');
  running=true;
  setTimeout(()=>showMessage('THE SERPENT IS REMEMBERING.',4200),900);
  setTimeout(()=>intro.remove(),1800);
}

/* ================= INIT ================= */
function init(){
  scene=new THREE.Scene();
  /* FIX: denser fog + shorter far plane = far fewer pixels/vertices drawn */
  scene.fog=new THREE.FogExp2(0x07120f,.014);
  camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,200);
  renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance',depth:true,stencil:false,alpha:false});
  renderer.setSize(innerWidth,innerHeight,false);
  const mobile=innerWidth<800||/iPhone|iPad|Android/i.test(navigator.userAgent);
  renderer.setPixelRatio(mobile?Math.min(devicePixelRatio,1.15):Math.min(devicePixelRatio,1.35));
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.18;
  game.appendChild(renderer.domElement);

  createSky();
  scene.add(new THREE.HemisphereLight(0x9bb6a4,0x020604,.72));
  const moon=new THREE.DirectionalLight(0xb7cdb4,1.25);
  moon.position.copy(moonDirection).multiplyScalar(100);
  scene.add(moon);

  createTerrain();createJungle();createRuins();createNagaClues();createWater();createFireflies();createRifle();
  player={x:0,y:2,z:105,vy:0,grounded:true};
  camera.position.set(player.x,player.y,player.z);
  createCreatures();createMuzzleLight();createUVLight();createBloodSystem();

  addEventListener('resize',resize);
  setupKeyboard();setupTouch();
  clock.start();
  requestAnimationFrame(loop);
}

/* ================= SKY (follows camera, inside far plane) ================= */
function createSky(){
  const mat=new THREE.ShaderMaterial({
    side:THREE.BackSide,depthWrite:false,fog:false,
    vertexShader:`varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`varying vec3 vP;void main(){
      float h=max(vP.y,0.0);
      vec3 col=mix(vec3(.005,.018,.015),vec3(.018,.075,.065),smoothstep(0.0,.55,h));
      col=mix(col,vec3(.004,.012,.025),smoothstep(.55,1.0,h));
      col+=vec3(.55,.65,.50)*pow(max(dot(vP,normalize(vec3(-.48,.72,-.52))),0.0),350.0);
      float st=step(.997,fract(sin(dot(vP.xy,vec2(91.17,43.71)))*18317.23));
      col+=vec3(.18,.23,.18)*st*h;
      gl_FragColor=vec4(col,1.0);}`
  });
  sky=new THREE.Mesh(new THREE.SphereGeometry(150,20,12),mat);
  sky.renderOrder=-1;sky.frustumCulled=false;
  scene.add(sky);
}

/* ================= TERRAIN ================= */
function terrainHeight(x,z){
  let y=Math.sin(x*.055)*2.4+Math.cos(z*.052)*2.2+Math.sin((x+z)*.025)*3+Math.sin(x*.13+z*.07)*.65;
  y+=Math.max(0,1-Math.sqrt(x*x+z*z)/230)*1.8;
  return y;
}
function createTerrain(){
  const geo=new THREE.PlaneGeometry(460,460,100,100);
  geo.rotateX(-Math.PI/2);
  const pos=geo.attributes.position;
  for(let i=0;i<pos.count;i++)pos.setY(i,terrainHeight(pos.getX(i),pos.getZ(i)));
  geo.computeVertexNormals();
  /* FIX: Lambert instead of Standard (PBR) */
  scene.add(new THREE.Mesh(geo,new THREE.MeshLambertMaterial({color:0x17251b})));

  const moss=new THREE.InstancedMesh(new THREE.CircleGeometry(1,6),
    new THREE.MeshBasicMaterial({color:0x263d25,transparent:true,opacity:.35,depthWrite:false}),650);
  for(let i=0;i<650;i++){
    const x=(Math.random()-.5)*400,z=(Math.random()-.5)*400,s=.4+Math.random()*1.8;
    dummy.position.set(x,terrainHeight(x,z)+.08,z);
    dummy.rotation.set(-Math.PI/2,0,Math.random()*Math.PI);
    dummy.scale.set(s,s*.5,s);
    dummy.updateMatrix();moss.setMatrixAt(i,dummy.matrix);
  }
  scene.add(moss);
}
function createWater(){
  const w=new THREE.Mesh(new THREE.PlaneGeometry(260,260),
    new THREE.MeshLambertMaterial({color:0x061d1a,transparent:true,opacity:.78}));
  w.rotation.x=-Math.PI/2;w.position.y=WATER;
  scene.add(w);
}

/* ================= JUNGLE ================= */
function createJungle(){
  const trunkMesh=new THREE.InstancedMesh(new THREE.CylinderGeometry(.35,.65,7,6),new THREE.MeshLambertMaterial({color:0x17140f}),850);
  const canopyMesh=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(3.8,1),new THREE.MeshLambertMaterial({color:0x102b1b}),850);
  for(let i=0;i<850;i++){
    const a=Math.random()*Math.PI*2,r=18+Math.random()*195;
    const x=Math.cos(a)*r,z=Math.sin(a)*r;
    if(Math.abs(x)<12&&Math.abs(z-105)<20){
      trunkMesh.setMatrixAt(i,ZERO);canopyMesh.setMatrixAt(i,ZERO);continue; /* FIX: skipped slots no longer sit at origin */
    }
    const y=terrainHeight(x,z),s=.65+Math.random()*1.8;
    dummy.position.set(x,y+3.5*s,z);
    dummy.scale.set(s,s*(.9+Math.random()*.7),s);
    dummy.rotation.y=Math.random()*Math.PI;
    dummy.updateMatrix();trunkMesh.setMatrixAt(i,dummy.matrix);
    dummy.position.y=y+7*s;dummy.scale.setScalar(s);
    dummy.updateMatrix();canopyMesh.setMatrixAt(i,dummy.matrix);
  }
  scene.add(trunkMesh,canopyMesh);

  const leafMesh=new THREE.InstancedMesh(new THREE.PlaneGeometry(3.5,1.5),
    new THREE.MeshLambertMaterial({color:0x244d2d,side:THREE.DoubleSide}),450);
  for(let i=0;i<450;i++){
    const x=(Math.random()-.5)*390,z=(Math.random()-.5)*390;
    dummy.position.set(x,terrainHeight(x,z)+1+Math.random()*4,z);
    dummy.rotation.set(Math.random()*.8,Math.random()*Math.PI,Math.random()*1.5);
    dummy.scale.setScalar(.5+Math.random()*1.7);
    dummy.updateMatrix();leafMesh.setMatrixAt(i,dummy.matrix);
  }
  scene.add(leafMesh);vegetation.push(leafMesh);

  const vineMesh=new THREE.InstancedMesh(new THREE.CylinderGeometry(.035,.055,1,5),new THREE.MeshLambertMaterial({color:0x1b4927}),360);
  for(let i=0;i<180;i++){
    const x=(Math.random()-.5)*380,z=(Math.random()-.5)*380,base=terrainHeight(x,z),h=3+Math.random()*8;
    for(let j=0;j<2;j++){
      dummy.position.set(x+Math.sin(i*1.7+j)*.7,base+7-j*h*.48,z+Math.cos(i*1.3+j)*.7);
      dummy.scale.set(1,h*.55,1);
      dummy.rotation.set(Math.cos(i*1.9+j)*.12,0,Math.sin(i*2.3+j)*.22);
      dummy.updateMatrix();vineMesh.setMatrixAt(i*2+j,dummy.matrix);
    }
  }
  scene.add(vineMesh);

  const stems=new THREE.InstancedMesh(new THREE.CylinderGeometry(.035,.06,.35,5),new THREE.MeshLambertMaterial({color:0xb5a48a}),180);
  const caps=new THREE.InstancedMesh(new THREE.SphereGeometry(.16,7,4),new THREE.MeshBasicMaterial({color:0x70836e}),180);
  for(let i=0;i<180;i++){
    const x=(Math.random()-.5)*380,z=(Math.random()-.5)*380,y=terrainHeight(x,z),s=.8+Math.random()*.8;
    dummy.position.set(x,y+.18,z);dummy.rotation.set(0,Math.random()*Math.PI,0);dummy.scale.setScalar(s);
    dummy.updateMatrix();stems.setMatrixAt(i,dummy.matrix);
    dummy.position.y=y+.38;dummy.scale.y=.45;
    dummy.updateMatrix();caps.setMatrixAt(i,dummy.matrix);
  }
  scene.add(stems,caps);
}

/* ================= RUINS (shared geometry) ================= */
function createRuins(){
  const positions=[[-55,-45],[58,-70],[8,-120],[-105,-95],[95,-8],[-95,55]];
  const ruinMat=new THREE.MeshLambertMaterial({color:0x404338});
  const baseMat=new THREE.MeshLambertMaterial({color:0x353b30});
  const eyeMat=new THREE.MeshBasicMaterial({color:0x9ebc64});
  const baseGeo=new THREE.CylinderGeometry(10,12,1.5,8);
  const pillarGeo=new THREE.BoxGeometry(1.5,6,1.5);
  const eyeGeo=new THREE.SphereGeometry(.55,10,8);
  positions.forEach(p=>{
    const g=new THREE.Group();
    g.position.set(p[0],terrainHeight(p[0],p[1]),p[1]);
    const base=new THREE.Mesh(baseGeo,baseMat);base.position.y=.7;g.add(base);
    for(let i=0;i<6;i++){
      const a=i/6*Math.PI*2,pl=new THREE.Mesh(pillarGeo,ruinMat);
      pl.position.set(Math.cos(a)*6,3.7,Math.sin(a)*6);pl.rotation.y=-a;g.add(pl);
    }
    const eye=new THREE.Mesh(eyeGeo,eyeMat);eye.position.set(0,6.2,0);g.add(eye);
    scene.add(g);
  });
}
function createNagaClues(){
  const ringGeo=new THREE.TorusGeometry(1.5,.07,5,14),ringMat=new THREE.MeshLambertMaterial({color:0x3f493b});
  const eyeGeo=new THREE.SphereGeometry(.13,6,5),eyeMat=new THREE.MeshBasicMaterial({color:0x8aa85e});
  for(let i=0;i<14;i++){
    const x=(Math.random()-.5)*300,z=(Math.random()-.5)*300,g=new THREE.Group();
    const ring=new THREE.Mesh(ringGeo,ringMat);ring.rotation.x=Math.PI/2;ring.scale.setScalar(.75+Math.random()*.9);g.add(ring);
    const eye=new THREE.Mesh(eyeGeo,eyeMat);eye.position.y=.15;g.add(eye);
    g.position.set(x,terrainHeight(x,z)+.06,z);scene.add(g);
  }
}

/* ================= FIREFLIES ================= */
const fireflies=[];
function createFireflies(){
  const count=360,arr=new Float32Array(count*3);
  for(let i=0;i<count;i++){arr[i*3]=(Math.random()-.5)*350;arr[i*3+1]=1+Math.random()*13;arr[i*3+2]=(Math.random()-.5)*350}
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(arr,3));
  const pts=new THREE.Points(geo,new THREE.PointsMaterial({color:0xb7d984,size:.13,transparent:true,opacity:.75,depthWrite:false}));
  pts.userData.phase=Math.random()*100;
  scene.add(pts);fireflies.push(pts);
}
let fireflyTimer=0;
function updateFireflies(t){
  if(++fireflyTimer%3!==0)return;
  const tt=t*.0004;
  for(const pts of fireflies){
    const a=pts.geometry.attributes.position.array,ph=pts.userData.phase;
    for(let i=0;i<a.length;i+=3){
      const k=i*.013+ph;
      a[i]+=Math.sin(tt+k)*.002;a[i+1]+=Math.sin(t*.001+k)*.003;a[i+2]+=Math.cos(tt*.7+k)*.002;
    }
    pts.geometry.attributes.position.needsUpdate=true;
  }
}

/* ================= RIFLE ================= */
function createRifle(){
  rifle=new THREE.Group();
  const dark=new THREE.MeshStandardMaterial({color:0x111311,roughness:.72,metalness:.35});
  const wood=new THREE.MeshStandardMaterial({color:0x292019,roughness:1});
  const add=(geo,mat,x,y,z,rx)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);if(rx)m.rotation.x=rx;rifle.add(m);return m};
  add(new THREE.BoxGeometry(.22,.26,1.35),dark,.25,-.28,-.75);
  add(new THREE.BoxGeometry(.18,.25,.85),wood,.25,-.28,.2);
  add(new THREE.CylinderGeometry(.055,.055,2.8,8),dark,.25,-.28,-2,Math.PI/2);
  add(new THREE.CylinderGeometry(.08,.08,.75,12),dark,.25,-.05,-1,Math.PI/2);
  const lens=add(new THREE.CircleGeometry(.055,12),new THREE.MeshBasicMaterial({color:0x273c31}),.25,-.05,-1.39);
  lens.rotation.y=Math.PI;
  camera.add(rifle);scene.add(camera);
}

/* ================= CREATURES ================= */
const M=(c,r)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const creatureMaterials={white:M(0xccc9b8,.9),dark:M(0x26312b,1),green:M(0x334c39,.85),greenHead:M(0x435d46,.7),
  eyeGreen:new THREE.MeshBasicMaterial({color:0xb7df75}),eyeGold:new THREE.MeshBasicMaterial({color:0xe2bc66}),eyeNaga:new THREE.MeshBasicMaterial({color:0xc8df77})};
const sg={whiteBody:new THREE.IcosahedronGeometry(1.25,1),darkBody:new THREE.IcosahedronGeometry(1.45,1),
  eye:new THREE.SphereGeometry(.14,8,6),eyeSmall:new THREE.SphereGeometry(.12,7,5),nagaHead:new THREE.ConeGeometry(1.2,2.2,7),
  seg:[1.05,.92,.79,.66].map(r=>new THREE.SphereGeometry(r,8,6))};
function creatureModel(type){
  const g=new THREE.Group();
  const eyes=(geo,mat,y,z,sp)=>{for(let i=0;i<2;i++){const e=new THREE.Mesh(geo,mat);e.position.set((i-.5)*sp,y,z);g.add(e)}};
  if(type===0){
    g.add(new THREE.Mesh(sg.whiteBody,creatureMaterials.white));
    eyes(sg.eye,creatureMaterials.eyeGreen,.3,-1.05,.48);
  }else if(type===1){
    const b=new THREE.Mesh(sg.darkBody,creatureMaterials.dark);b.scale.set(1.2,.65,1.5);g.add(b);
    eyes(sg.eyeSmall,creatureMaterials.eyeGold,.15,-1.3,.42);
  }else{
    const h=new THREE.Mesh(sg.nagaHead,creatureMaterials.greenHead);h.rotation.x=-Math.PI/2;g.add(h);
    sg.seg.forEach((geo,i)=>{const s=new THREE.Mesh(geo,creatureMaterials.green);s.position.z=.8+i*.9;g.add(s)});
    eyes(sg.eye,creatureMaterials.eyeNaga,.3,-.75,.52);
  }
  return g;
}
function createCreatures(){for(let i=0;i<11;i++)spawnCreature(i%3)}
function spawnCreature(type){
  const g=creatureModel(type);
  let x,z;
  do{const a=Math.random()*Math.PI*2,r=45+Math.random()*95;x=player.x+Math.cos(a)*r;z=player.z+Math.sin(a)*r}
  while(Math.abs(x)>200||Math.abs(z)>200);
  g.position.set(x,terrainHeight(x,z)+1,z);
  creatures.push({g,type,hp:[80,120,190][type],speed:[5.4,3.7,2.7][type],damage:[8,12,18][type],cooldown:0,alive:true,hit:0,phase:Math.random()*10});
  scene.add(g);
}

/* ================= BOSS ================= */
function createBoss(){
  if(bossActive)return;
  bossActive=true;boss=new THREE.Group();
  const bodyMat=new THREE.MeshStandardMaterial({color:0x263c2d,roughness:.7,metalness:.1});
  const headMat=new THREE.MeshStandardMaterial({color:0x566c49,roughness:.7,metalness:.1});
  for(let i=0;i<13;i++){
    const s=new THREE.Mesh(new THREE.SphereGeometry(5-i*.27,9,7),i<2?headMat:bodyMat);
    s.position.set(Math.sin(i*.8)*i*1.3,4+Math.sin(i*.9)*1.4,-i*4);
    s.userData.seg=true;boss.add(s);
  }
  const eyeMat=new THREE.MeshBasicMaterial({color:0xd4e779}),eyeGeo=new THREE.SphereGeometry(.38,10,7);
  for(let i=0;i<2;i++){const e=new THREE.Mesh(eyeGeo,eyeMat);e.position.set((i-.5)*1.3,5,-3);boss.add(e)}
  boss.position.set(player.x+35,terrainHeight(player.x+35,player.z-30),player.z-30);
  scene.add(boss);bossHP=1000;
  showMessage('THE SERPENT HAS AWAKENED',5000);
}

/* ================= INPUT ================= */
function setupKeyboard(){
  addEventListener('keydown',e=>{
    keys[e.code]=true;
    if(e.code==='KeyR')reload();
    if(e.code==='KeyC')toggleScope();
    if(e.code==='KeyF')uvFlash();
    if(e.code==='Space')jump();
  });
  addEventListener('keyup',e=>{keys[e.code]=false});
  renderer.domElement.addEventListener('click',()=>{if(!scoped)shoot()});
  renderer.domElement.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'){lookActive=true;lastLookX=e.clientX;lastLookY=e.clientY}
  });
  addEventListener('pointerup',()=>{lookActive=false});
  addEventListener('pointermove',e=>{
    if(!lookActive||e.pointerType!=='mouse')return;
    yaw-=(e.clientX-lastLookX)*.0025;
    pitch=Math.max(-1.35,Math.min(1.35,pitch-(e.clientY-lastLookY)*.002));
    lastLookX=e.clientX;lastLookY=e.clientY;
  });
}
function setupTouch(){
  const pad=$('movePad'),knob=$('moveKnob');
  /* FIX: pads now have pointer-events:auto in CSS, so these actually fire */
  const movePadTouch=e=>{
    e.preventDefault();
    const t=e.touches[0],r=pad.getBoundingClientRect();
    let dx=t.clientX-(r.left+r.width/2),dy=t.clientY-(r.top+r.height/2);
    const max=40,len=Math.hypot(dx,dy);
    if(len>max){dx=dx/len*max;dy=dy/len*max}
    moveX=dx/max;moveY=dy/max;
    knob.style.transform=`translate(${dx}px,${dy}px)`;
  };
  pad.addEventListener('touchstart',movePadTouch,{passive:false});
  pad.addEventListener('touchmove',movePadTouch,{passive:false});
  const endMove=()=>{moveX=0;moveY=0;knob.style.transform=''};
  pad.addEventListener('touchend',endMove);
  pad.addEventListener('touchcancel',endMove);

  const look=$('lookPad');
  look.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];lastLookX=t.clientX;lastLookY=t.clientY},{passive:false});
  look.addEventListener('touchmove',e=>{
    e.preventDefault();
    const t=e.touches[0];
    yaw-=(t.clientX-lastLookX)*.004;
    pitch=Math.max(-1.3,Math.min(1.3,pitch-(t.clientY-lastLookY)*.003));
    lastLookX=t.clientX;lastLookY=t.clientY;
  },{passive:false});

  [['fire',shoot],['aim',toggleScope],['jump',jump],['reload',reload],['torch',uvFlash]].forEach(([id,fn])=>{
    $(id).addEventListener('touchstart',e=>{e.preventDefault();fn()},{passive:false});
  });
}

/* ================= PLAYER ================= */
function updatePlayer(dt){
  let mx=0,mz=0;
  if(keys.KeyW)mz-=1;if(keys.KeyS)mz+=1;if(keys.KeyA)mx-=1;if(keys.KeyD)mx+=1;
  mx+=moveX;mz+=moveY;
  const len=Math.hypot(mx,mz);
  if(len>1){mx/=len;mz/=len}
  const sprint=keys.ShiftLeft||keys.ShiftRight;
  const speed=sprint&&stamina>0?9:5;
  stamina+=(sprint&&len>0)?-dt*16:dt*10;
  stamina=Math.max(0,Math.min(100,stamina));
  const sy=Math.sin(yaw),cy=Math.cos(yaw);
  player.x=Math.max(-205,Math.min(205,player.x+(mx*cy-mz*sy)*speed*dt));
  player.z=Math.max(-205,Math.min(205,player.z+(mx*sy+mz*cy)*speed*dt));
  const ground=terrainHeight(player.x,player.z)+2;
  player.vy-=G*dt;player.y+=player.vy*dt;
  if(player.y<=ground){player.y=ground;player.vy=0;player.grounded=true}
  camera.position.set(player.x,player.y+(len>0?Math.sin(performance.now()*.012)*.025:0),player.z);
  camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;
  sky.position.copy(camera.position); /* sky follows the player */
}
function jump(){if(player&&player.grounded){player.vy=7.2;player.grounded=false}}
function toggleScope(){
  scoped=!scoped;
  $('scope').classList.toggle('on',scoped);
  camera.fov=scoped?24:70;camera.updateProjectionMatrix();
}
let scopeTimer=0;
function updateScope(dt){
  if(!scoped)return;
  scopeTimer-=dt;if(scopeTimer>0)return;scopeTimer=.08;
  const range=25+Math.hypot(camera.position.x,camera.position.z)*.25;
  const drop=Math.max(0,G*Math.pow(range/BULLET_SPEED,2)*.5),wind=WIND*range/BULLET_SPEED;
  $('scopeData').textContent=`RANGE ${range.toFixed(0)}m • DROP ${drop.toFixed(2)} • WIND ${wind.toFixed(2)}`;
}

/* ================= LIGHTS ================= */
let muzzleLight,muzzleTimer=0,uvLight,uvTimer=0;
function createMuzzleLight(){muzzleLight=new THREE.PointLight(0xffd8a0,0,10);scene.add(muzzleLight)}
function muzzleFlash(){muzzleLight.position.copy(camera.position);muzzleLight.intensity=4;muzzleTimer=.045}
function updateMuzzle(dt){if(muzzleTimer>0&&(muzzleTimer-=dt)<=0)muzzleLight.intensity=0}
function createUVLight(){uvLight=new THREE.SpotLight(0x9cdbff,0,38,Math.PI/8,.8);scene.add(uvLight,uvLight.target)}
function uvFlash(){
  if(!uvLight||uv<=0)return;
  uv-=12;
  uvLight.position.copy(camera.position);
  camera.getWorldDirection(VEC3);
  uvLight.target.position.copy(camera.position).add(VEC3.multiplyScalar(10));
  uvLight.intensity=8;uvTimer=.5;
}
function updateUV(dt){if(uvTimer>0&&(uvTimer-=dt)<=0)uvLight.intensity=0}

/* ================= SHOOTING ================= */
function shoot(){
  if(!running||cooldown>0)return;
  if(ammo<=0){showMessage('MAGAZINE EMPTY',900);return}
  ammo--;cooldown=.38;recoil=.13;updateAmmo();
  camera.getWorldDirection(VEC1);
  bullets.push({pos:camera.position.clone(),vel:VEC1.clone().multiplyScalar(BULLET_SPEED),life:3});
  muzzleFlash();
}
function updateBullets(dt){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.vel.y-=G*dt;b.vel.x+=WIND*dt;
    b.pos.addScaledVector(b.vel,dt);b.life-=dt;
    let hit=false;
    for(const c of creatures){
      if(!c.alive)continue;
      const radius=c.type===2?2.5:c.type===1?1.8:1.6;
      if(c.g.position.distanceTo(b.pos)<radius){
        c.hp-=scoped?55:35;c.hit=.12;hit=true;
        blood(b.pos,c.type===2?12:7);
        if(c.hp<=0)killCreature(c);
        break;
      }
    }
    if(bossActive&&boss&&boss.position.distanceTo(b.pos)<8){
      bossHP-=scoped?55:30;blood(b.pos,15);hit=true;
      if(bossHP<=0)killBoss();
    }
    if(hit||b.life<=0)bullets.splice(i,1);
  }
}
function reload(){
  if(ammo>=12||reserve<=0)return;
  const give=Math.min(12-ammo,reserve);
  ammo+=give;reserve-=give;updateAmmo();
  showMessage('RELOADING EXPEDITION MAG',800);
}
function updateAmmo(){$('mag').textContent=`${ammo} / ${reserve}`}

/* ================= CREATURE AI ================= */
function updateCreatures(dt){
  for(const c of creatures){
    if(!c.alive)continue;
    c.cooldown-=dt;c.hit=Math.max(0,c.hit-dt);
    const p=c.g.position,dx=player.x-p.x,dz=player.z-p.z,dist=Math.hypot(dx,dz);
    if(dist<95){
      const inv=1/(dist||1),nx=dx*inv,nz=dz*inv;
      const side=c.type===1?Math.sin(performance.now()*.001+c.phase)*.45:0;
      p.x+=(nx+side)*c.speed*dt;p.z+=(nz+side)*c.speed*dt;
      p.y=terrainHeight(p.x,p.z)+(c.type===1?.9:1.2);
      c.g.rotation.y=Math.atan2(dx,dz);
      if(dist<2.7&&c.cooldown<=0){damagePlayer(c.damage);c.cooldown=1.2}
    }else p.y=terrainHeight(p.x,p.z)+1;
    c.g.scale.setScalar(c.hit>0?1+c.hit*.8:1);
  }
  if(kills>=4&&!bossActive)createBoss();
}
function killCreature(c){
  c.alive=false;kills++;score+=100;
  showMessage(c.type===0?'SPIRIT DOWN':c.type===1?'STALKER DOWN':'NAGA SPAWN DOWN',700);
  blood(c.g.position,18);scene.remove(c.g);
  setTimeout(()=>{
    if(!running)return;
    const i=creatures.indexOf(c);
    if(i>=0)creatures.splice(i,1);
    spawnCreature(Math.floor(Math.random()*3));
  },4500);
}
function killBoss(){
  bossActive=false;
  showMessage('THE SERPENT RETURNS TO THE MIST',5000);
  blood(boss.position,100);scene.remove(boss);boss=null;score+=5000;
}
function updateBoss(dt){
  if(!bossActive||!boss)return;
  const dx=player.x-boss.position.x,dz=player.z-boss.position.z,dist=Math.hypot(dx,dz);
  if(dist<80){
    const inv=1/(dist||1);
    boss.position.x+=dx*inv*1.7*dt;boss.position.z+=dz*inv*1.7*dt;
    boss.position.y=terrainHeight(boss.position.x,boss.position.z)+4;
    boss.rotation.y=Math.atan2(dx,dz);
    if(dist<9)damagePlayer(24*dt);
  }
  const t=performance.now()*.002;
  for(let i=0;i<boss.children.length;i++){
    const ch=boss.children[i];
    if(ch.userData.seg)ch.position.y+=Math.sin(t+i)*.01;
  }
}
function damagePlayer(amount){
  hp=Math.max(0,hp-amount);
  $('hp').style.width=hp+'%';
  const d=$('damage');d.style.opacity=.75;
  setTimeout(()=>{d.style.opacity=0},120);
  if(hp<=0)gameOver();
}

/* ================= BLOOD POOL ================= */
const BLOOD_MAX=600;
let bloodMesh;const bloodData=[];
function createBloodSystem(){
  bloodMesh=new THREE.InstancedMesh(new THREE.SphereGeometry(.065,5,4),
    new THREE.MeshBasicMaterial({color:0x68a5d2,transparent:true,opacity:.9}),BLOOD_MAX);
  bloodMesh.count=0;bloodMesh.frustumCulled=false;
  scene.add(bloodMesh);
  for(let i=0;i<BLOOD_MAX;i++)bloodData.push({active:false,life:0,x:0,y:0,z:0,vx:0,vy:0,vz:0,scale:1});
}
let bloodCursor=0;
function blood(pos,count){
  if(!bloodMesh)return;
  for(let i=0;i<count;i++){
    /* FIX: rotating cursor instead of scanning the whole pool for every droplet */
    let p=null;
    for(let k=0;k<BLOOD_MAX;k++){
      const q=bloodData[(bloodCursor+k)%BLOOD_MAX];
      if(!q.active){p=q;bloodCursor=(bloodCursor+k+1)%BLOOD_MAX;break}
    }
    if(!p){p=bloodData[bloodCursor];bloodCursor=(bloodCursor+1)%BLOOD_MAX}
    p.active=true;p.life=.5+Math.random()*.8;
    p.x=pos.x;p.y=pos.y;p.z=pos.z;
    p.vx=(Math.random()-.5)*4;p.vy=Math.random()*4;p.vz=(Math.random()-.5)*4;
    p.scale=.45+Math.random()*.9;
  }
}
function updateBlood(dt){
  if(!bloodMesh)return;
  let n=0;
  for(let i=0;i<BLOOD_MAX;i++){
    const p=bloodData[i];
    if(!p.active)continue;
    p.life-=dt;
    if(p.life<=0){p.active=false;continue}
    p.vy-=G*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;
    dummy.position.set(p.x,p.y,p.z);
    dummy.scale.setScalar(p.scale*Math.min(1,p.life*2));
    dummy.rotation.set(p.vy,p.vx,p.vz);
    dummy.updateMatrix();bloodMesh.setMatrixAt(n++,dummy.matrix);
  }
  bloodMesh.count=n;
  if(n)bloodMesh.instanceMatrix.needsUpdate=true;
}

/* ================= MESSAGE / GAME OVER ================= */
let messageTimer;
function showMessage(text,time=1500){
  const el=$('message');
  el.textContent=text;el.classList.add('show');
  clearTimeout(messageTimer);
  messageTimer=setTimeout(()=>el.classList.remove('show'),time);
}
function gameOver(){
  if(!running)return;
  running=false;
  showMessage('THE JUNGLE HAS CLAIMED YOU',999999);
  setTimeout(()=>location.reload(),3500);
}

/* ================= ADAPTIVE QUALITY =================
   FIX 1: receives RAW frame time (the clamped dt made fps look like >=30 forever)
   FIX 2: only steps pixel ratio DOWN quickly; steps UP rarely (setPixelRatio reallocates the framebuffer) */
let frameCounter=0,qualityTimer=0,lastRatioChange=0;
function adaptiveQuality(rawDt){
  frameCounter++;qualityTimer+=rawDt;
  if(qualityTimer<2.5)return;
  const fps=frameCounter/qualityTimer;
  frameCounter=0;qualityTimer=0;
  const now=performance.now();
  if(fps<27&&quality>0){
    quality--;
    renderer.setPixelRatio(Math.max(.7,renderer.getPixelRatio()-.15));
    lastRatioChange=now;
    if(vegetation[0])vegetation[0].count=Math.max(150,Math.floor(vegetation[0].count*.7));
    if(quality===0&&vegetation[0])vegetation[0].visible=false;
  }else if(fps>55&&quality<2&&now-lastRatioChange>20000){
    quality++;
    renderer.setPixelRatio(Math.min(1.2,renderer.getPixelRatio()+.1));
    lastRatioChange=now;
    if(vegetation[0]){vegetation[0].visible=true;vegetation[0].count=450}
  }
}

/* ================= MAIN LOOP ================= */
let lastDist=-1;
function loop(){
  requestAnimationFrame(loop);
  if(!running)return;
  const raw=clock.getDelta();
  const dt=Math.min(.033,raw);
  const t=performance.now();
  cooldown=Math.max(0,cooldown-dt);
  recoil*=.84;
  updatePlayer(dt);updateCreatures(dt);updateBoss(dt);updateBullets(dt);updateBlood(dt);
  updateFireflies(t);updateScope(dt);updateMuzzle(dt);updateUV(dt);
  adaptiveQuality(raw);
  if(rifle){rifle.rotation.x=-recoil*1.8;rifle.position.z=recoil*1.8}
  /* FIX: only touch the DOM when the value changes */
  const dist=Math.round(Math.hypot(player.x,player.z));
  if(dist!==lastDist){lastDist=dist;$('location').textContent=`NAGALOKA • ${dist} m`}
  renderer.render(scene,camera);
}
function resize(){
  if(!camera||!renderer)return;
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight,false);
}
