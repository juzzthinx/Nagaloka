<script>

'use strict';

/* =========================================================

   NAGALOKA

   THE SERPENT REMEMBERS

========================================================= */

const game = document.getElementById('game');

let scene,camera,renderer;

let clock = new THREE.Clock();

let running=false;

let scoped=false;

let muted=false;

let player;

let rifle;

let creatures=[];

let bullets=[];

let particles=[];

let fireflies=[];

let ruins=[];

let trees=[];

let vegetation=[];

let serpentClues=[];

let yaw=0;

let pitch=0;

let moveX=0;

let moveY=0;

let lookActive=false;

let lastLookX=0;

let lastLookY=0;

let keys={};

let hp=100;

let ammo=12;

let reserve=48;

let cooldown=0;

let recoil=0;

let stamina=100;

let uv=100;

let score=0;

let kills=0;

let boss=null;

let bossActive=false;

let bossHP=1000;

let quality=2;

const WORLD=220;

const WATER=-3;

const G=9.8;

const BULLET_SPEED=170;

const ZERO_RANGE=40;

const WIND=.55;

const moonDirection=new THREE.Vector3(-.48,.72,-.52).normalize();

/* =========================================================

   INTRO

========================================================= */

const intro=document.getElementById('intro');

const signalBar=document.getElementById('signalBar');

const loadingText=document.getElementById('loadingText');

const serpentSilhouette=document.getElementById('serpentSilhouette');

const glitch=document.getElementById('glitch');

const introMessages=[

  'CHECKING MAGNETIC COMPASS...',

  'TUNING THE GAMELAN...',

  'RESTORING EXPEDITION AUDIO...',

  'GROWING THE JUNGLE...',

  'SEARCHING FOR THE SERPENT...',

  'THE SERPENT IS REMEMBERING.'

];

let loadProgress=0;

function introLoad(){

  loadProgress+=Math.random()*2.5+.7;

  if(loadProgress>100) loadProgress=100;

  signalBar.style.width=loadProgress+'%';

  let id=Math.min(

    introMessages.length-1,

    Math.floor(loadProgress/18)

  );

  loadingText.textContent=introMessages[id];

  if(loadProgress>63){

    serpentSilhouette.classList.add('show');

  }

  if(Math.random()<.07){

    glitch.classList.remove('on');

    void glitch.offsetWidth;

    glitch.classList.add('on');

  }

  if(loadProgress<100){

    setTimeout(introLoad,55);

  }else{

    loadingText.textContent='TAPE READY • PRESS TO ENTER';

  }

}

setTimeout(introLoad,350);

document.getElementById('enter').addEventListener('click',startGame);

document.getElementById('enter').addEventListener('touchstart',startGame,{passive:false});

function startGame(e){

  if(e)e.preventDefault();

  if(running)return;

  init();

  intro.classList.add('hide');

  running=true;

  setTimeout(()=>{

    showMessage('THE SERPENT IS REMEMBERING.',4200);

  },900);

  setTimeout(()=>{

    intro.remove();

  },1800);

}

/* =========================================================

   THREE.JS

========================================================= */

function init(){

  scene=new THREE.Scene();

  scene.fog=new THREE.FogExp2(

    0x07120f,

    .009

  );

  camera=new THREE.PerspectiveCamera(

    70,

    innerWidth/innerHeight,

    .1,

    500

  );

  camera.position.set(0,2,105);

  renderer=new THREE.WebGLRenderer({

    antialias:false,

    powerPreference:'high-performance'

  });

  renderer.setSize(innerWidth,innerHeight);

  renderer.setPixelRatio(

    Math.min(devicePixelRatio,1.45)

  );

  renderer.outputEncoding=THREE.sRGBEncoding;

  renderer.toneMapping=THREE.ACESFilmicToneMapping;

  renderer.toneMappingExposure=1.18;

  game.appendChild(renderer.domElement);

  createSky();

  const hemi=new THREE.HemisphereLight(

    0x9bb6a4,

    0x020604,

    .72

  );

  scene.add(hemi);

  const moon=new THREE.DirectionalLight(

    0xb7cdb4,

    1.25

  );

  moon.position.copy(moonDirection).multiplyScalar(100);

  scene.add(moon);

  createTerrain();

  createJungle();

  createRuins();

  createNagaClues();

  createWater();

  createFireflies();

  createRifle();

  player={

    x:0,

    y:2,

    z:105,

    vy:0,

    grounded:true

  };

  camera.position.set(

    player.x,

    player.y,

    player.z

  );

  createCreatures();

  window.addEventListener('resize',resize);

  setupKeyboard();

  setupTouch();

  clock.start();

  requestAnimationFrame(loop);

}

/* =========================================================

   SKY

========================================================= */

function createSky(){

  const geo=new THREE.SphereGeometry(

    250,

    24,

    16

  );

  const mat=new THREE.ShaderMaterial({

    side:THREE.BackSide,

    uniforms:{

      uMoon:{value:moonDirection}

    },

    vertexShader:`

      varying vec3 vP;

      void main(){

        vP=normalize(position);

        gl_Position=

          projectionMatrix*

          modelViewMatrix*

          vec4(position,1.0);

      }

    `,

    fragmentShader:`

      varying vec3 vP;

      void main(){

        float h=max(vP.y,0.0);

        vec3 bottom=vec3(

          0.005,

          0.018,

          0.015

        );

        vec3 middle=vec3(

          0.018,

          0.075,

          0.065

        );

        vec3 top=vec3(

          0.004,

          0.012,

          0.025

        );

        vec3 col=mix(bottom,middle,

          smoothstep(0.0,.55,h));

        col=mix(col,top,

          smoothstep(.55,1.0,h));

        float moon=

          pow(max(dot(vP,

          normalize(vec3(-.48,.72,-.52))),0.0),350.0);

        col+=vec3(.55,.65,.50)*moon;

        float stars=

          step(.997,

          fract(sin(

            dot(vP.xy,

            vec2(91.17,43.71))

          )*18317.23));

        col+=vec3(.18,.23,.18)*stars*h;

        gl_FragColor=vec4(col,1.0);

      }

    `

  });

  scene.add(new THREE.Mesh(geo,mat));

}

/* =========================================================

   TERRAIN

========================================================= */

function terrainHeight(x,z){

  let y=

    Math.sin(x*.055)*2.4+

    Math.cos(z*.052)*2.2+

    Math.sin((x+z)*.025)*3.0+

    Math.sin(x*.13+z*.07)*.65;

  const d=Math.sqrt(x*x+z*z);

  y+=Math.max(0,1-d/230)*1.8;

  return y;

}

function createTerrain(){

  const geo=new THREE.PlaneGeometry(

    460,

    460,

    100,

    100

  );

  geo.rotateX(-Math.PI/2);

  const pos=geo.attributes.position;

  for(let i=0;i<pos.count;i++){

    const x=pos.getX(i);

    const z=pos.getZ(i);

    pos.setY(

      i===pos.count-1 ?

      terrainHeight(x,z) :

      terrainHeight(x,z)

    );

  }

  geo.computeVertexNormals();

  const mat=new THREE.MeshStandardMaterial({

    color:0x17251b,

    roughness:1,

    metalness:0

  });

  const mesh=new THREE.Mesh(geo,mat);

  scene.add(mesh);

  /* moss patches */

  for(let i=0;i<650;i++){

    const x=(Math.random()-.5)*400;

    const z=(Math.random()-.5)*400;

    const y=terrainHeight(x,z)+.08;

    const g=new THREE.CircleGeometry(

      .4+Math.random()*1.8,

      5

    );

    const m=new THREE.MeshBasicMaterial({

      color:Math.random()<.5?0x273d25:0x1e3020,

      transparent:true,

      opacity:.35,

function setupKeyboard(){

  addEventListener('keydown',e=>{

    keys[e.code]=true;

    if(e.code==='KeyR'){

      reload();

    }

    if(e.code==='KeyC'){

      toggleScope();

    }

    if(e.code==='KeyF'){

      uvFlash();

    }

    if(e.code==='Space'){

      jump();

    }

    if(e.code==='KeyM'){

      muted=!muted;

    }

  });

  addEventListener('keyup',e=>{

    keys[e.code]=false;

  });

  renderer.domElement.addEventListener(

    'click',

    ()=>{

      if(!scoped)shoot();

    }

  );

  renderer.domElement.addEventListener(

    'pointerdown',

    e=>{

      if(e.pointerType==='mouse'){

        lookActive=true;

        lastLookX=e.clientX;

        lastLookY=e.clientY;

      }

    }

  );

  addEventListener('pointerup',()=>{

    lookActive=false;

  });

  addEventListener('pointermove',e=>{

    if(!lookActive)return;

    const dx=e.clientX-lastLookX;

    const dy=e.clientY-lastLookY;

    lastLookX=e.clientX;

    lastLookY=e.clientY;

    yaw-=dx*.0025;

    pitch-=dy*.002;

    pitch=Math.max(-1.35,Math.min(1.35,pitch));

  });

}

function setupTouch(){

  const pad=document.getElementById('movePad');

  const knob=document.getElementById('moveKnob');

  pad.addEventListener('touchstart',e=>{

    e.preventDefault();

  },{passive:false});

  pad.addEventListener('touchmove',e=>{

    e.preventDefault();

    const t=e.touches[0];

    const r=pad.getBoundingClientRect();

    let dx=t.clientX-(r.left+r.width/2);

    let dy=t.clientY-(r.top+r.height/2);

    const max=40;

    const len=Math.hypot(dx,dy);

    if(len>max){

      dx=dx/len*max;

      dy=dy/len*max;

    }

    moveX=dx/max;

    moveY=dy/max;

    knob.style.transform=

      `translate(${dx}px,${dy}px)`;

  },{passive:false});

  pad.addEventListener('touchend',()=>{

    moveX=moveY=0;

    knob.style.transform='';

  });

  const look=document.getElementById('lookPad');

  look.addEventListener('touchstart',e=>{

    const t=e.touches[0];

    lastLookX=t.clientX;

    lastLookY=t.clientY;

    lookActive=true;

  });

  look.addEventListener('touchmove',e=>{

    const t=e.touches[0];

    const dx=t.clientX-lastLookX;

    const dy=t.clientY-lastLookY;

    lastLookX=t.clientX;

    lastLookY=t.clientY;

    yaw-=dx*.004;

    pitch-=dy*.003;

    pitch=Math.max(-1.3,Math.min(1.3,pitch));

  },{passive:false});

  look.addEventListener('touchend',()=>{

    lookActive=false;

  });

  bindButton('fire',shoot);

  bindButton('aim',toggleScope);

  bindButton('jump',jump);

  bindButton('reload',reload);

  bindButton('torch',uvFlash);

}

function bindButton(id,fn){

  const b=document.getElementById(id);

  b.addEventListener('touchstart',e=>{

    e.preventDefault();

    fn();

  },{passive:false});

}

/* =========================================================

   PLAYER

========================================================= */

function updatePlayer(dt){

  let mx=0;

  let mz=0;

  if(keys.KeyW)mz-=1;

  if(keys.KeyS)mz+=1;

  if(keys.KeyA)mx-=1;

  if(keys.KeyD)mx+=1;

  mx+=moveX;

  mz+=moveY;

  const len=Math.hypot(mx,mz);

  if(len>1){

    mx/=len;

    mz/=len;

  }

  const sprint=

    keys.ShiftLeft ||

    keys.ShiftRight;

  const speed=

    sprint && stamina>0 ? 9 : 5;

  if(sprint && len>0){

    stamina-=dt*16;

  }else{

    stamina+=dt*10;

  }

  stamina=Math.max(0,Math.min(100,stamina));

  const sy=Math.sin(yaw);

  const cy=Math.cos(yaw);

  const dx=

    mx*cy-

    mz*sy;

  const dz=

    mx*sy+

    mz*cy;

  player.x+=dx*speed*dt;

  player.z+=dz*speed*dt;

  player.x=Math.max(-205,Math.min(205,player.x));

  player.z=Math.max(-205,Math.min(205,player.z));

  const ground=

    terrainHeight(player.x,player.z)+2;

  player.vy-=G*dt;

  player.y+=player.vy*dt;

  if(player.y<=ground){

    player.y=ground;

    player.vy=0;

    player.grounded=true;

  }

  camera.position.set(

    player.x,

    player.y,

    player.z

  );

  camera.rotation.order='YXZ';

  camera.rotation.y=yaw;

  camera.rotation.x=pitch;

  const bob=

    len>0 ?

    Math.sin(performance.now()*.012)*.025 :

    0;

  camera.position.y+=bob;

}

function toggleScope(){

    .getElementById('scope')

    .classList.toggle('on',scoped);

  if(scoped){

    camera.fov=24;

    camera.updateProjectionMatrix();

  }else{

  }

}

function updateScope(){

  if(!scoped)return;

  const range=

    25+

    Math.sqrt(

      camera.position.x**2+

      camera.position.z**2

    )*.25;

  const drop=

    Math.max(

      0,

      G*

      Math.pow(range/BULLET_SPEED,2)*.5

    );

  const wind=

    WIND*range/BULLET_SPEED;

  document.getElementById('scopeData').textContent=

    `RANGE ${range.toFixed(0)}m • DROP ${drop.toFixed(2)} • WIND ${wind.toFixed(2)}`;

}

/* =========================================================

   SHOOTING

========================================================= */

function shoot(){

  if(!running)return;

  if(cooldown>0)return;

  if(ammo<=0){

    showMessage('MAGAZINE EMPTY',900);

    return;

  }

  ammo--;

  cooldown=.38;

  recoil=.13;

  updateAmmo();

  const dir=new THREE.Vector3();

  camera.getWorldDirection(dir);

  bullets.push({

    pos:camera.position.clone(),

    vel:dir.multiplyScalar(BULLET_SPEED),

    life:3

  });

  muzzleFlash();

}

function muzzleFlash(){

  const flash=new THREE.PointLight(

    0xffd8a0,

    4,

    10

  );

  flash.position.copy(camera.position);

  scene.add(flash);

  setTimeout(()=>{

    scene.remove(flash);

  },45);

}

function updateBullets(dt){

  for(let i=bullets.length-1;i>=0;i--){

    const b=bullets[i];

    const old=b.pos.clone();

    b.vel.y-=G*dt;

    b.vel.x+=WIND*dt;

    b.pos.addScaledVector(

      b.vel,

      dt

    );

    b.life-=dt;

    let hit=false;

    for(const c of creatures){

      if(!c.alive)continue;

      const d=

        c.g.position.distanceTo(

          b.pos

        );

      const radius=

        c.type===2?2.5:

        c.type===1?1.8:1.6;

      if(d<radius){

        const damage=

          scoped?

          55:

          35;

        c.hp-=damage;

        c.hit=.12;

        hit=true;

        blood(

          b.pos,

          c.type===2?12:7

        );

        if(c.hp<=0){

          killCreature(c);

        }

        break;

      }

    }

    if(

      bossActive &&

      boss

    ){

      const d=

        boss.position.distanceTo(

          b.pos

        );

      if(d<8){

        bossHP-=scoped?55:30;

        blood(b.pos,15);

        hit=true;

        if(bossHP<=0){

          killBoss();

        }

      }

    }

    if(hit || b.life<=0){

      bullets.splice(i,1);

    }

  }

}

/* =========================================================

   RELOAD

========================================================= */

function reload(){

  if(ammo>=12 || reserve<=0)return;

  const need=12-ammo;

  const give=Math.min(need,reserve);

  ammo+=give;

  reserve-=give;

  updateAmmo();

  showMessage('RELOADING EXPEDITION MAG',800);

}

function updateAmmo(){

  document.getElementById('mag').textContent=

    `${ammo} / ${reserve}`;

}

/* =========================================================

   CREATURE AI

========================================================= */

function updateCreatures(dt){

  for(const c of creatures){

    if(!c.alive)continue;

    c.cooldown-=dt;

    c.hit=Math.max(0,c.hit-dt);

    const dx=

      player.x-c.g.position.x;

    const dz=

      player.z-c.g.position.z;

    const dist=Math.hypot(dx,dz);

    if(dist<95){

      const nx=dx/(dist||1);

      const nz=dz/(dist||1);

      let speed=c.speed;

      /* stalker pauses and circles */

      if(c.type===1){

        const side=Math.sin(

          performance.now()*.001+

          c.phase

        );

        c.g.position.x+=

          (nx+side*.45)*speed*dt;

        c.g.position.z+=

          (nz+side*.45)*speed*dt;

      }else{

        c.g.position.x+=nx*speed*dt;

        c.g.position.z+=nz*speed*dt;

      }

      c.g.position.y=

        terrainHeight(

          c.g.position.x,

          c.g.position.z

        )+

        (c.type===1?.9:1.2);

      c.g.rotation.y=

        Math.atan2(dx,dz);

      if(dist<2.7 && c.cooldown<=0){

        damagePlayer(c.damage);

        c.cooldown=1.2;

      }

    }else{

      c.g.position.y=

        terrainHeight(

          c.g.position.x,

          c.g.position.z

        )+1;

    }

    if(c.hit>0){

      c.g.scale.setScalar(

        1+c.hit*.8

      );

    }else{

      c.g.scale.setScalar(1);

    }

  }

  /* first major awakening */

  if(kills>=4 && !bossActive){

    createBoss();

  }

}

/* =========================================================

   KILLS

========================================================= */

function killCreature(c){

  c.alive=false;

  kills++;

  score+=100;

  showMessage(

    c.type===0?

    'SPIRIT DOWN':

    c.type===1?

    'STALKER DOWN':

    'NAGA SPAWN DOWN',

    700

  );

  blood(

    c.g.position,

    18

  );

  scene.remove(c.g);

  setTimeout(()=>{

    if(running){

      const index=creatures.indexOf(c);

      if(index>=0){

        creatures.splice(index,1);

      }

      spawnCreature(

        Math.floor(Math.random()*3)

      );

    }

  },4500);

}

function killBoss(){

  bossActive=false;

  showMessage(

    'THE SERPENT RETURNS TO THE MIST',

    5000

  );

  blood(

    boss.position,

    100

  );

  scene.remove(boss);

  boss=null;

  score+=5000;

}

/* =========================================================

   DAMAGE

========================================================= */

function damagePlayer(amount){

  hp-=amount;

  hp=Math.max(0,hp);

  document.getElementById('hp').style.width=

    hp+'%';

  const damage=document.getElementById('damage');

  damage.style.opacity=.75;

  setTimeout(()=>{

    damage.style.opacity=0;

  },120);

  if(hp<=0){

    gameOver();

  }

}

/* =========================================================

   BLOOD / IMPACT PARTICLES

========================================================= */

function blood(pos,count){

  for(let i=0;i<count;i++){

    const mesh=new THREE.Mesh(

      new THREE.SphereGeometry(

        .035+Math.random()*.08,

        5,

        4

      ),

      new THREE.MeshBasicMaterial({

        color:0x68a5d2,

        transparent:true

      })

    );

    mesh.position.copy(pos);

    mesh.userData.vel=new THREE.Vector3(

      (Math.random()-.5)*4,

      Math.random()*4,

      (Math.random()-.5)*4

    );

    mesh.userData.life=

      .5+Math.random()*.8;

    scene.add(mesh);

    particles.push(mesh);

  }

}

/* =========================================================

   UV TORCH

========================================================= */

let uvLight;

function uvFlash(){

  if(uv<=0)return;

  uv-=12;

  if(!uvLight){

    uvLight=new THREE.SpotLight(

      0x9cdbff,

      8,

      38,

      Math.PI/8,

      .8

    );

    scene.add(uvLight);

  }

  uvLight.position.copy(camera.position);

  const dir=new THREE.Vector3();

  camera.getWorldDirection(dir);

  uvLight.target.position.copy(

    camera.position.clone().add(

      dir.multiplyScalar(10)

    )

  );

  scene.add(uvLight.target);

  setTimeout(()=>{

    if(uvLight){

      uvLight.intensity=0;

    }

  },500);

}

/* =========================================================

   BOSS UPDATE

========================================================= */

function updateBoss(dt){

  if(!bossActive || !boss)return;

  const dx=

    player.x-boss.position.x;

  const dz=

    player.z-boss.position.z;

  const dist=Math.hypot(dx,dz);

  if(dist<80){

    const nx=dx/(dist||1);

    const nz=dz/(dist||1);

    boss.position.x+=nx*1.7*dt;

    boss.position.z+=nz*1.7*dt;

    boss.position.y=

      terrainHeight(

        boss.position.x,

        boss.position.z

      )+4;

    boss.rotation.y=

      Math.atan2(dx,dz);

    if(dist<9){

      damagePlayer(24*dt);

    }

  }

  for(let i=0;i<boss.children.length;i++){

    const child=boss.children[i];

    if(child.geometry &&

       child.geometry.type==='SphereGeometry'){

      child.position.y+=

        Math.sin(

          performance.now()*.002+i

        )*.01;

    }

  }

}

/* =========================================================

   PARTICLES

========================================================= */

function updateParticles(dt){

  for(let i=particles.length-1;i>=0;i--){

    const p=particles[i];

    p.userData.life-=dt;

    p.userData.vel.y-=G*dt;

    p.position.addScaledVector(

      p.userData.vel,

      dt

    );

    p.material.opacity=

      Math.max(

        0,

        p.userData.life

      );

    if(p.userData.life<=0){

      scene.remove(p);

      particles.splice(i,1);

    }

  }

}

/* =========================================================

   FIREFLIES

========================================================= */

function updateFireflies(t){

  for(const pts of fireflies){

    const a=

      pts.geometry.attributes.position.array;

    for(let i=0;i<a.length;i+=3){

      a[i]+=Math.sin(t*.0004+i)*.001;

      a[i+1]+=Math.sin(t*.001+i)*.002;

      a[i+2]+=Math.cos(t*.0003+i)*.001;

    }

    pts.geometry.attributes.position.needsUpdate=true;

  }

}

/* =========================================================

   MESSAGE

========================================================= */

let messageTimer;

function showMessage(text,time=1500){

  const el=document.getElementById('message');

  el.textContent=text;

  el.classList.add('show');

  clearTimeout(messageTimer);

  messageTimer=setTimeout(()=>{

    el.classList.remove('show');

  },time);

}

/* =========================================================

   GAME OVER

========================================================= */

function gameOver(){

  running=false;

  showMessage(

    'THE JUNGLE HAS CLAIMED YOU',

    999999

  );

  setTimeout(()=>{

    location.reload();

  },3500);

}

/* =========================================================

   ADAPTIVE QUALITY

========================================================= */

let frameCounter=0;

let qualityTimer=0;

function adaptiveQuality(dt){

  frameCounter++;

  qualityTimer+=dt;

  if(qualityTimer<5)return;

  const fps=frameCounter/qualityTimer;

  frameCounter=0;

  qualityTimer=0;

  if(fps<30 && quality>0){

    quality--;

    renderer.setPixelRatio(

      Math.max(.75,

      renderer.getPixelRatio()-.2)

    );

  }

  if(fps>52 && quality<2){

    quality++;

    renderer.setPixelRatio(

      Math.min(1.45,

      renderer.getPixelRatio()+.1)

    );

  }

}

/* =========================================================

   MAIN LOOP

========================================================= */

function loop(){

  requestAnimationFrame(loop);

  if(!running)return;

  const dt=Math.min(

    .033,

    clock.getDelta()

  );

  const t=performance.now();

  cooldown=Math.max(0,cooldown-dt);

  recoil*=.84;

  updatePlayer(dt);

  updateCreatures(dt);

  updateBoss(dt);

  updateBullets(dt);

  updateParticles(dt);

  updateFireflies(t);

  updateScope();

  adaptiveQuality(dt);

  /* rifle recoil */

  if(rifle){

    rifle.rotation.x=

      -recoil*1.8;

    rifle.position.z=

      recoil*1.8;

  }

  /* distance */

  const distance=Math.round(

    Math.sqrt(

      player.x*player.x+

      player.z*player.z

    )

  );

  document.getElementById('location').textContent=

    `NAGALOKA • ${distance} m`;

  renderer.render(

    scene,

    camera

  );

}

/* =========================================================

   RESIZE

========================================================= */

function resize(){

  if(!camera || !renderer)return;

  camera.aspect=

    innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(

    innerWidth,

    innerHeight

  );

}

</script>
