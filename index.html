<script>

/* =========================================================

========================================================= */

const game=document.getElementById('game');

let scene,camera,renderer;

let running=false;

let rifle;

let ammo=12;

   REUSABLE VECTORS

========================================================= */

const VEC1=new THREE.Vector3();

const VEC2=new THREE.Vector3();

const dummy=new THREE.Object3D();

/* =========================================================

   INTRO

========================================================= */

const intro=document.getElementById('intro');

const signalBar=document.getElementById('signalBar');

const loadingText=document.getElementById('loadingText');

const serpentSilhouette=

  document.getElementById('serpentSilhouette');

const glitch=document.getElementById('glitch');

const introMessages=[

  'CHECKING MAGNETIC COMPASS...',

  'TUNING THE GAMELAN...',

  'RESTORING EXPEDITION AUDIO...',

  'GROWING THE JUNGLE...',

  'SEARCHING FOR THE SERPENT...',

  'THE SERPENT IS REMEMBERING.'

];

let loadProgress=0;

function introLoad(){

  loadProgress+=Math.random()*2.5+.7;

  if(loadProgress>100)

    loadProgress=100;

  signalBar.style.width=

    loadProgress+'%';

  const id=Math.min(

    introMessages.length-1,

    Math.floor(loadProgress/18)

  );

  loadingText.textContent=

    introMessages[id];

  if(loadProgress>63)

    serpentSilhouette.classList.add('show');

  if(Math.random()<.07){

    glitch.classList.remove('on');

    void glitch.offsetWidth;

    glitch.classList.add('on');

  }

  if(loadProgress<100){

    setTimeout(

      introLoad,

      55

    );

  }else{

    loadingText.textContent=

      'TAPE READY • PRESS TO ENTER';

  }

}

setTimeout(

  introLoad,

  350

);

document

  .getElementById('enter')

  .addEventListener(

    'click',

    startGame

  );

document

  .getElementById('enter')

  .addEventListener(

    'touchstart',

    startGame,

    {passive:false}

  );

function startGame(e){

  if(e)

    e.preventDefault();

  if(running)

    return;

  init();

  intro.classList.add('hide');

  running=true;

  setTimeout(

    ()=>{

      showMessage(

        'THE SERPENT IS REMEMBERING.',

        4200

      );

    },

    900

  );

  setTimeout(

    ()=>{

      intro.remove();

    },

    1800

  );

}

/* =========================================================

   THREE.JS INIT

========================================================= */

function init(){

  scene=new THREE.Scene();

  scene.fog=new THREE.FogExp2(

    0x07120f,

    .009

  );

  camera=new THREE.PerspectiveCamera(

    70,

    innerWidth/innerHeight,

    .1,

    500

  );

  camera.position.set(

    0,2,105

  );

  renderer=new THREE.WebGLRenderer({

    antialias:false,

    powerPreference:'high-performance',

    depth:true,

    stencil:false,

    alpha:false

  });

  renderer.setSize(

    innerWidth,

    innerHeight,

    false

  );

  /*

    iPhone 11:

    start around 1.15 instead of 1.45.

    Adaptive quality can increase later.

  */

  const mobile=

    innerWidth<800 ||

    /iPhone|iPad|Android/i.test(

      navigator.userAgent

    );

  renderer.setPixelRatio(

    mobile

      ? Math.min(devicePixelRatio,1.15)

      : Math.min(devicePixelRatio,1.35)

  renderer.outputEncoding=

    THREE.sRGBEncoding;

  renderer.toneMapping=

    THREE.ACESFilmicToneMapping;

  renderer.toneMappingExposure=1.18;

  game.appendChild(

    renderer.domElement

  );

  createSky();

  const hemi=

    new THREE.HemisphereLight(

      0x9bb6a4,

      0x020604,

      .72

    );

  scene.add(hemi);

  const moon=

    new THREE.DirectionalLight(

      0xb7cdb4,

      1.25

    );

  moon.position

    .copy(moonDirection)

    .multiplyScalar(100);

  scene.add(moon);

  createTerrain();

  createJungle();

  createRuins();

  createNagaClues();

  createWater();

  createFireflies();

  createRifle();

  player={

    x:0,

    y:2,

    z:105,

    vy:0,

    grounded:true

  };

  camera.position.set(

    player.x,

    player.y,

    player.z

  );

  createCreatures();

  /*

    One reusable muzzle light.

  */

  createMuzzleLight();

  /*

    One reusable UV light.

  */

  createUVLight();

  window.addEventListener(

    'resize',

    resize

  );

  setupKeyboard();

  setupTouch();

  clock.start();

  requestAnimationFrame(loop);

}

/* =========================================================

   SKY

========================================================= */

function createSky(){

  const geo=

    new THREE.SphereGeometry(

      250,

      24,

      16

    );

  const mat=

    new THREE.ShaderMaterial({

      side:THREE.BackSide,

      uniforms:{

        uMoon:{

          value:moonDirection

        }

      },

      vertexShader:`

        varying vec3 vP;

        void main(){

          vP=normalize(position);

          gl_Position=

            projectionMatrix*

            modelViewMatrix*

            vec4(position,1.0);

        }

      `,

      fragmentShader:`

        varying vec3 vP;

        void main(){

          float h=

            max(vP.y,0.0);

          vec3 bottom=

            vec3(

              0.005,

              0.018,

              0.015

            );

          vec3 middle=

            vec3(

              0.018,

              0.075,

              0.065

            );

          vec3 top=

            vec3(

              0.004,

              0.012,

              0.025

            );

          vec3 col=

            mix(

              bottom,

              middle,

              smoothstep(0.0,.55,h)

            );

          col=

            mix(

              col,

              top,

              smoothstep(.55,1.0,h)

            );

          float moon=

            pow(

              max(

                dot(

                  vP,

                  normalize(

                    vec3(

                      -.48,.72,-.52

                    )

                  )

function terrainHeight(x,z){

  let y=

    Math.sin(x*.055)*2.4+

    Math.cos(z*.052)*2.2+

    Math.sin((x+z)*.025)*3.0+

    Math.sin(x*.13+z*.07)*.65;

  const d=

    Math.sqrt(x*x+z*z);

  y+=

    Math.max(

      0,

      1-d/230

    )*1.8;

  return y;

}

function createTerrain(){

  const geo=

      if(e.code==='KeyC')

        toggleScope();

      if(e.code==='KeyF')

        uvFlash();

      if(e.code==='Space')

        jump();

      if(e.code==='KeyM')

        muted=!muted;

    }

  );

  addEventListener(

    'keyup',

    e=>{

      keys[e.code]=false;

    }

  );

  renderer.domElement.addEventListener(

    'click',

    ()=>{

      if(!scoped)

        shoot();

    }

  );

  renderer.domElement.addEventListener(

    'pointerdown',

    e=>{

      if(e.pointerType==='mouse'){

        lookActive=true;

        lastLookX=e.clientX;

        lastLookY=e.clientY;

      }

    }

  );

  addEventListener(

    'pointerup',

    ()=>{

      lookActive=false;

    }

  );

  addEventListener(

    'pointermove',

    e=>{

      if(!lookActive)

        return;

      const dx=

        e.clientX-lastLookX;

      const dy=

        e.clientY-lastLookY;

      lastLookX=e.clientX;

      lastLookY=e.clientY;

      yaw-=dx*.0025;

      pitch-=dy*.002;

      pitch=

        Math.max(

          -1.35,

          Math.min(

            1.35,

            pitch

          )

        );

    }

  );

}

function setupTouch(){

  const pad=

    document.getElementById(

      'movePad'

    );

  const knob=

    document.getElementById(

      'moveKnob'

    );

  pad.addEventListener(

    'touchstart',

    e=>{

      e.preventDefault();

    },

    {passive:false}

  );

  pad.addEventListener(

    'touchmove',

    e=>{

      e.preventDefault();

      const t=e.touches[0];

      const r=

        pad.getBoundingClientRect();

      let dx=

        t.clientX-

        (r.left+r.width/2);

      let dy=

        t.clientY-

        (r.top+r.height/2);

      const max=40;

      const len=

        Math.hypot(

          dx,

          dy

        );

      if(len>max){

        dx=

          dx/len*max;

        dy=

          dy/len*max;

      }

      moveX=

        dx/max;

      moveY=

        dy/max;

      knob.style.transform=

        `translate(${dx}px,${dy}px)`;

    },

    {passive:false}

  );

  pad.addEventListener(

    'touchend',

    ()=>{

      moveX=0;

      moveY=0;

      knob.style.transform='';

    }

  );

  const look=

    document.getElementById(

      'lookPad'

    );

  look.addEventListener(

    'touchstart',

    e=>{

      const t=e.touches[0];

      lastLookX=t.clientX;

      lastLookY=t.clientY;

      lookActive=true;

    }

  );

  look.addEventListener(

    'touchmove',

    e=>{

      const t=e.touches[0];

      const dx=

        t.clientX-lastLookX;

      const dy=

        t.clientY-lastLookY;

      lastLookX=t.clientX;

      lastLookY=t.clientY;

      yaw-=dx*.004;

      pitch-=dy*.003;

      pitch=

        Math.max(

          -1.3,

          Math.min(

            1.3,

            pitch

          )

        );

    },

    {passive:false}

  );

  look.addEventListener(

    'touchend',

    ()=>{

      lookActive=false;

    }

  );

  bindButton(

    'fire',

    shoot

  );

  bindButton(

    'aim',

    toggleScope

  );

  bindButton(

    'jump',

    jump

  );

  bindButton(

    'reload',

    reload

  );

  bindButton(

    'torch',

    uvFlash

  );

}

function bindButton(id,fn){

  const b=

    document.getElementById(id);

  b.addEventListener(

    'touchstart',

    e=>{

      e.preventDefault();

      fn();

    },

    {passive:false}

  );

}

/* =========================================================

   PLAYER

========================================================= */

function updatePlayer(dt){

  let mx=0;

  let mz=0;

  if(keys.KeyW)

    mz-=1;

  if(keys.KeyS)

    mz+=1;

  if(keys.KeyA)

    mx-=1;

  if(keys.KeyD)

    mx+=1;

  mx+=moveX;

  mz+=moveY;

  const len=

    Math.hypot(

      mx,

      mz

    );

  if(len>1){

    mx/=len;

    mz/=len;

  }

  const sprint=

    keys.ShiftLeft ||

    keys.ShiftRight;

  const speed=

    sprint &&

    stamina>0

      ?9

      :5;

  if(

    sprint &&

    len>0

  ){

    stamina-=

      dt*16;

  }else{

    stamina+=

      dt*10;

  }

  stamina=

    Math.max(

      0,

      Math.min(

        100,

        stamina

      )

    );

  const sy=

    Math.sin(yaw);

  const cy=

    Math.cos(yaw);

  const dx=

    mx*cy-

    mz*sy;

  const dz=

    mx*sy+

    mz*cy;

  player.x+=

    dx*speed*dt;

  player.z+=

    dz*speed*dt;

  player.x=

    Math.max(

      -205,

      Math.min(

        205,

        player.x

      )

    );

  player.z=

    Math.max(

      -205,

      Math.min(

        205,

        player.z

      )

    );

  const ground=

    terrainHeight(

      player.x,

      player.z

    )+2;

  player.vy-=

    G*dt;

  player.y+=

    player.vy*dt;

  if(

    player.y<=ground

  ){

    player.y=ground;

    player.vy=0;

    player.grounded=true;

  }

  camera.position.set(

    player.x,

    player.y,

    player.z

  );

  camera.rotation.order=

    'YXZ';

  camera.rotation.y=

    yaw;

  camera.rotation.x=

    pitch;

  const bob=

    len>0

      ?Math.sin(

        performance.now()*.012

      )*.025

      :0;

  camera.position.y+=bob;

}

/* =========================================================

   BULLETS

========================================================= */

function updateBullets(dt){

  for(

    let i=bullets.length-1;

    i>=0;

    i--

  ){

    const b=

      bullets[i];

    const old=

      VEC2.copy(

        b.pos

      );

    b.vel.y-=

      G*dt;

    b.vel.x+=

      WIND*dt;

    b.pos.addScaledVector(

      b.vel,

      dt

    );

    b.life-=dt;

    let hit=false;

    /*

      Creature checks.

      Kept exact gameplay-wise.

    */

    for(

      const c of creatures

    ){

      if(!c.alive)

        continue;

      const d=

        c.g.position.distanceTo(

          b.pos

        );

      const radius=

        c.type===2

          ?2.5

          :c.type===1

            ?1.8

            :1.6;

      if(d<radius){

        const damage=

          scoped

            ?55

            :35;

        c.hp-=damage;

        c.hit=.12;

        hit=true;

        blood(

          b.pos,

          c.type===2

            ?12

            :7

        );

        if(c.hp<=0)

          killCreature(c);

        break;

      }

    }

    if(

      bossActive &&

      boss

    ){

      const d=

        boss.position.distanceTo(

          b.pos

        );

      if(d<8){

        bossHP-=

          scoped

            ?55

            :30;

        blood(

          b.pos,

          15

        );

        hit=true;

        if(bossHP<=0)

          killBoss();

      }

    }

    if(

      hit ||

      b.life<=0

    ){

      bullets.splice(

        i,

        1

      );

    }

  }

}

    Math.min(

      need,

      reserve

  reserve-=give;

  updateAmmo();

  showMessage(

    800

  );

   CREATURE AI

let creatureAIAccumulator=0;

function updateCreatures(dt){

  /*

    Full-rate movement is preserved,

    but terrain calculations are kept local.

  */

  for(

    const c of creatures

  ){

    if(!c.alive)

      continue;

    c.cooldown-=dt;

    c.hit=

      Math.max(

        0,

        c.hit-dt

      );

    const dx=

      player.x-

      c.g.position.x;

    const dz=

      player.z-

      c.g.position.z;

    const dist=

      Math.hypot(

        dx,

        dz

      );

    if(dist<95){

      const inv=

        1/(dist||1);

      const nx=

        dx*inv;

      const nz=

        dz*inv;

      let speed=

        c.speed;

      if(c.type===1){

        const side=

          Math.sin(

            performance.now()*.001+

            c.phase

          );

        c.g.position.x+=

          (nx+side*.45)*

          speed*

          dt;

        c.g.position.z+=

          (nz+side*.45)*

          speed*

          dt;

      }else{

        c.g.position.x+=

          nx*speed*dt;

        c.g.position.z+=

          nz*speed*dt;

      }

      c.g.position.y=

        terrainHeight(

          c.g.position.x,

          c.g.position.z

        )+

        (

          c.type===1

            ?.9

            :1.2

        );

      c.g.rotation.y=

        Math.atan2(

          dx,

          dz

        );

      if(

        dist<2.7 &&

        c.cooldown<=0

      ){

        damagePlayer(

          c.damage

        );

        c.cooldown=1.2;

      }

    }else{

      c.g.position.y=

        terrainHeight(

          c.g.position.x,

          c.g.position.z

        )+1;

    }

    if(c.hit>0){

      c.g.scale.setScalar(

        1+

        c.hit*.8

      );

    }else{

      c.g.scale.setScalar(1);

    }

  }

  if(

    kills>=4 &&

    !bossActive

  ){

    createBoss();

  }

}

/* =========================================================

   POOLED BLUE BLOOD SYSTEM

=========================================================

   ORIGINAL:

   Every blood droplet created:

   - new Geometry

   - new Material

   - new Mesh

   This is very expensive on iPhone.

   NEW:

   One InstancedMesh.

   600 droplets are recycled.

========================================================= */

const BLOOD_MAX=600;

let bloodMesh;

let bloodData=[];

function createBloodSystem(){

  const geo=

    new THREE.SphereGeometry(

      .065,

      5,

      4

    );

  const mat=

    new THREE.MeshBasicMaterial({

      color:0x68a5d2,

      transparent:true,

      opacity:.9

    });

  bloodMesh=

    new THREE.InstancedMesh(

      geo,

      mat,

      BLOOD_MAX

    );

  bloodMesh.count=0;

  scene.add(

    bloodMesh

  );

  for(

    let i=0;

    i<BLOOD_MAX;

    i++

  ){

    bloodData.push({

      active:false,

      life:0,

      x:0,

      y:0,

      z:0,

      vx:0,

      vy:0,

      vz:0,

      scale:1

    });

  }

}

function blood(pos,count){

  if(!bloodMesh)

    return;

  for(

    let i=0;

    i<count;

    i++

  ){

    let p=null;

    /*

      Find inactive particle.

    */

    for(

      let j=0;

      j<BLOOD_MAX;

      j++

    ){

      if(!bloodData[j].active){

        p=bloodData[j];

        break;

      }

    }

    /*

      If pool is full,

      recycle an early particle.

    */

    if(!p){

      p=

        bloodData[

          (Math.random()*BLOOD_MAX)|0

        ];

    }

    p.active=true;

    p.life=

      .5+

      Math.random()*.8;

    p.x=pos.x;

    p.y=pos.y;

    p.z=pos.z;

    p.vx=

      (Math.random()-.5)*4;

    p.vy=

      Math.random()*4;

    p.vz=

      (Math.random()-.5)*4;

    p.scale=

      .45+

      Math.random()*.9;

  }

}

function updateBlood(dt){

  if(!bloodMesh)

    return;

  let activeCount=0;

  for(

    let i=0;

    i<BLOOD_MAX;

    i++

  ){

    const p=

      bloodData[i];

    if(!p.active)

      continue;

    p.life-=dt;

    if(p.life<=0){

      p.active=false;

      continue;

    }

    p.vy-=

      G*dt;

    p.x+=

      p.vx*dt;

    p.y+=

      p.vy*dt;

    p.z+=

      p.vz*dt;

    dummy.position.set(

      p.x,

      p.y,

      p.z

    );

    const s=

      p.scale*

      Math.min(

        1,

        p.life*2

      );

    dummy.scale.setScalar(

      s

    );

    dummy.rotation.set(

      p.vy,

      p.vx,

      p.vz

    );

    dummy.updateMatrix();

    bloodMesh.setMatrixAt(

      activeCount,

      dummy.matrix

    );

    activeCount++;

  }

  bloodMesh.count=

    activeCount;

  bloodMesh.instanceMatrix.needsUpdate=true;

}

/* =========================================================

   BOSS UPDATE

========================================================= */

function updateBoss(dt){

  if(

    !bossActive ||

    !boss

  )

    return;

  const dx=

    player.x-

    boss.position.x;

  const dz=

    player.z-

    boss.position.z;

  const dist=

    Math.hypot(

      dx,

      dz

    );

  if(dist<80){

    const inv=

      1/(dist||1);

    const nx=

      dx*inv;

    const nz=

      dz*inv;

    boss.position.x+=

      nx*1.7*dt;

    boss.position.z+=

      nz*1.7*dt;

    boss.position.y=

      terrainHeight(

        boss.position.x,

        boss.position.z

      )+4;

    boss.rotation.y=

      Math.atan2(

        dx,

        dz

      );

    if(dist<9){

      damagePlayer(

        24*dt

      );

    }

  }

  /*

    Boss animation.

    Kept but throttled slightly.

  */

  const t=

    performance.now()*.002;

  for(

    let i=0;

    i<boss.children.length;

    i++

  ){

    const child=

      boss.children[i];

    if(

      child.geometry &&

      child.geometry.type===

        'SphereGeometry'

    ){

      child.position.y+=

        Math.sin(

          t+i

        )*.01;

    }

  }

}

/* =========================================================

   FIREFLIES

========================================================= */

let fireflyTimer=0;

function updateFireflies(t){

  /*

    Update only every ~3 frames.

    Human eye cannot distinguish the

    difference at this scale.

  */

  fireflyTimer++;

  if(

    fireflyTimer%3!==0

  )

    return;

  const tt=

    t*.0004;

  for(

    const pts of fireflies

  ){

    const a=

      pts.geometry

        .attributes

        .position

        .array;

    const phase=

      pts.userData.phase;

    /*

      Use coarse movement.

      This avoids 360*3 calculations

      every single frame.

    */

    for(

      let i=0;

      i<a.length;

      i+=3

    ){

      const k=

        i*.013+

        phase;

      a[i]+=

        Math.sin(

          tt+k

        )*.002;

      a[i+1]+=

        Math.sin(

          t*.001+

          k

        )*.003;

      a[i+2]+=

        Math.cos(

          tt*.7+

          k

        )*.002;

    }

    pts.geometry

      .attributes

      .position

      .needsUpdate=true;

  }

}

/* =========================================================

   ADAPTIVE QUALITY

=========================================================

   The important difference:

   We do NOT immediately remove the

   visual density.

   Instead:

   1. lower render resolution first

   2. lower distant grass/vegetation

   3. keep close jungle

   4. restore gradually

========================================================= */

let frameCounter=0;

let qualityTimer=0;

let currentPixelRatio=0;

function adaptiveQuality(dt){

  frameCounter++;

  qualityTimer+=dt;

  if(

    qualityTimer<2.5

  )

    return;

  const fps=

    frameCounter/

    qualityTimer;

  frameCounter=0;

  qualityTimer=0;

  /*

    HEAVY

  */

  if(fps<27){

    if(quality>0){

      quality--;

      currentPixelRatio=

        Math.max(

          .78,

          renderer.getPixelRatio()-.12

        );

      renderer.setPixelRatio(

        currentPixelRatio

      );

      reduceVegetation();

    }

  }

  /*

    MEDIUM / GOOD

  */

  else if(

    fps>48 &&

    quality<2

  ){

    quality++;

    currentPixelRatio=

      Math.min(

        1.25,

        renderer.getPixelRatio()+.06

      );

    renderer.setPixelRatio(

      currentPixelRatio

    );

    restoreVegetation();

  }

}

function reduceVegetation(){

  if(

    !trees.length

  )

    return;

  /*

    Keep trunks and canopies

    visually dense.

    Reduce only secondary

    vegetation first.

  */

  if(

    vegetation[0]

  ){

    vegetation[0].count=

      Math.max(

        180,

        Math.floor(

          vegetation[0].count*.78

        )

      );

  }

}

function restoreVegetation(){

  if(

    vegetation[0]

  ){

    vegetation[0].count=

      450;

  }

}

/* =========================================================

   DISTANCE-BASED TREE OPTIMIZATION

========================================================= */

let jungleVisibilityTimer=0;

function updateJungleVisibility(dt){

  /*

    Don't perform expensive work

    every frame.

  */

  jungleVisibilityTimer-=dt;

  if(

    jungleVisibilityTimer>0

  )

    return;

  jungleVisibilityTimer=.35;

  /*

    Keep all trees visible.

    Three.js handles frustum culling.

    Only disable secondary leaf batch

    at very low quality.

  */

  if(

    vegetation[0]

  ){

    vegetation[0].visible=

      quality>0;

  }

}

/* =========================================================

   MAIN LOOP

========================================================= */

function loop(){

  requestAnimationFrame(

    loop

  );

  if(!running)

    return;

  const dt=

    Math.min(

      .033,

      clock.getDelta()

    );

  const t=

    performance.now();

  cooldown=

    Math.max(

      0,

      cooldown-dt

    );

  recoil*=.84;

  updatePlayer(dt);

  updateCreatures(dt);

  updateBoss(dt);

  updateBullets(dt);

  updateBlood(dt);

  updateParticles(dt);

  updateFireflies(t);

  updateScope(dt);

  updateMuzzle(dt);

  updateUV(dt);

  updateJungleVisibility(dt);

  adaptiveQuality(dt);

  /*

    Rifle recoil

  */

  if(rifle){

    rifle.rotation.x=

      -recoil*1.8;

    rifle.position.z=

      recoil*1.8;

  }

  /*

    Distance HUD

  */

  const distance=

    Math.round(

      Math.sqrt(

        player.x*player.x+

        player.z*player.z

      )

    );

  document

    .getElementById(

      'location'

    )

    .textContent=

      `NAGALOKA • ${distance} m`;

  renderer.render(

    scene,

    camera

  );

}

/* =========================================================

   RESIZE

========================================================= */

function resize(){

  if(

    !camera ||

    !renderer

  )

    return;

  camera.aspect=

    innerWidth/

    innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(

    innerWidth,

    innerHeight,

    false

  );

}

/* =========================================================

   START BLOOD POOL AFTER SCENE EXISTS

========================================================= */

/*

   Small delayed initialization means

   the first render doesn't fight a huge

   allocation burst.

*/

const originalInit=init;

init=function(){

  originalInit();

  createBloodSystem();

};

</script>
