<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NAGALOKA — THE SERPENT REMEMBERS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@400;600;800&family=Share+Tech+Mono&display=swap');
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{width:100%;height:100%;overflow:hidden;background:#020806;color:#d9e5cf;font-family:'Share Tech Mono',monospace}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#game{position:fixed;inset:0;overflow:hidden}
#intro{position:fixed;inset:0;z-index:1000;background:#020604;overflow:hidden;transition:opacity 1.4s ease,filter 1.4s ease}
#intro.hide{opacity:0;filter:brightness(2) blur(8px);pointer-events:none}
#introSky{position:absolute;inset:0;background:radial-gradient(circle at 72% 28%,rgba(190,220,164,.18),transparent 8%),linear-gradient(#020a08 0%,#06130f 48%,#020604 100%)}
#moon{position:absolute;width:160px;height:160px;right:14%;top:13%;border-radius:50%;background:radial-gradient(circle at 38% 34%,#f0ead1,#aaa98c 52%,#696b58 75%,transparent 76%);box-shadow:0 0 30px rgba(220,232,180,.16),0 0 100px rgba(170,205,150,.09);opacity:.86}
#introJungle{position:absolute;left:0;right:0;bottom:0;height:58%;background:linear-gradient(transparent 0%,rgba(1,7,5,.15) 15%,rgba(1,5,4,.96) 75%),repeating-linear-gradient(82deg,transparent 0 22px,rgba(1,4,3,.9) 23px 31px,transparent 32px 52px);clip-path:polygon(0 55%,3% 48%,6% 56%,10% 39%,13% 54%,17% 45%,21% 57%,26% 38%,30% 51%,35% 42%,39% 58%,44% 37%,49% 51%,54% 42%,59% 55%,64% 35%,69% 50%,74% 40%,79% 54%,84% 37%,89% 51%,94% 41%,100% 52%,100% 100%,0 100%)}
#serpentSilhouette{position:absolute;left:10%;bottom:26%;width:78%;height:18%;opacity:0;transition:opacity 2s ease}
#serpentSilhouette.show{opacity:.72}
#serpentSilhouette:before{content:"";position:absolute;left:5%;top:52%;width:88%;height:22px;border-radius:50%;background:#010302;box-shadow:50px -15px 0 -5px #010302,110px 8px 0 -4px #010302,180px -12px 0 -6px #010302,270px 7px 0 -5px #010302,350px -8px 0 -4px #010302,440px 6px 0 -6px #010302;transform:rotate(-3deg)}
#serpentSilhouette:after{content:"";position:absolute;right:0;top:22%;width:65px;height:70px;background:#010302;clip-path:polygon(0 70%,15% 25%,40% 5%,68% 25%,100% 75%,62% 64%,35% 100%)}
.vhs{position:absolute;inset:0;pointer-events:none}
.vhs:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.025) 0,rgba(255,255,255,.025) 1px,transparent 2px,transparent 5px);opacity:.7}
.vhs:after{content:"";position:absolute;left:-10%;width:120%;height:18px;top:35%;background:rgba(220,255,220,.045);box-shadow:0 140px rgba(220,255,220,.025),0 300px rgba(220,255,220,.03);animation:tracking 7s linear infinite}
@keyframes tracking{0%{transform:translateY(-100px)}100%{transform:translateY(100vh)}}
#introUI{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding-top:4vh}
#archive{font-size:10px;letter-spacing:5px;opacity:.6;margin-bottom:18px}
#title{font-family:'Big Shoulders Stencil Display',sans-serif;font-size:clamp(55px,13vw,130px);line-height:.78;letter-spacing:8px;color:#d9e4bd;text-shadow:0 0 8px rgba(200,235,160,.25),4px 4px 0 rgba(0,0,0,.65)}
#subtitle{margin-top:18px;font-size:clamp(12px,2vw,18px);letter-spacing:7px;color:#9da98d}
#tagline{margin-top:32px;font-size:11px;letter-spacing:4px;color:#b8c9a7;min-height:16px}
#date{position:absolute;left:22px;top:20px;font-size:10px;line-height:1.8;color:#aab89a;opacity:.65;text-align:left}
#rec{position:absolute;right:22px;top:20px;font-size:10px;color:#b3c59d;letter-spacing:2px}
#rec i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#a8c478;margin-right:5px;animation:blink .8s infinite}
@keyframes blink{50%{opacity:.15}}
#signal{margin-top:35px;width:min(420px,72vw);height:4px;background:rgba(180,210,150,.08);overflow:hidden}
#signalBar{width:0%;height:100%;background:#9eb67d;box-shadow:0 0 12px rgba(170,210,130,.4)}
#enter{margin-top:28px;border:1px solid rgba(180,210,150,.32);background:rgba(4,13,9,.48);color:#d8e7c4;padding:14px 30px;font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:4px;cursor:pointer;transition:.2s;animation:enterPulse 2s infinite}
#enter:hover{background:rgba(180,210,150,.12);border-color:#c0d99c}
@keyframes enterPulse{50%{box-shadow:0 0 25px rgba(170,210,130,.05)}}
#loadingText{margin-top:14px;font-size:9px;color:#78866e;letter-spacing:2px}
#glitch{position:absolute;inset:0;opacity:0;background:rgba(210,255,210,.05);pointer-events:none}
#glitch.on{animation:glitch .18s steps(2)}
@keyframes glitch{0%{opacity:1;transform:translateX(-8px)}50%{opacity:.3;transform:translateX(12px)}100%{opacity:0;transform:translateX(0)}}
#hud{position:fixed;inset:0;z-index:20;pointer-events:none}
#topLeft{position:absolute;left:18px;top:16px;font-size:11px;line-height:1.8;letter-spacing:2px;text-shadow:0 1px 4px #000}
#location{color:#bdcea9}
#status{color:#687b61}
#vitals{position:absolute;left:18px;bottom:22px;width:190px}
#vitalText{font-size:10px;letter-spacing:2px;margin-bottom:5px}
#hpBar{height:5px;width:100%;background:rgba(255,255,255,.08)}
#hp{height:100%;width:100%;background:#9db67b;transition:width .2s}
#ammo{position:absolute;right:20px;bottom:20px;text-align:right}
#mag{font-family:'Big Shoulders Stencil Display',sans-serif;font-size:38px;letter-spacing:2px}
#ammo small{font-size:9px;letter-spacing:2px;color:#819077}
#message{position:absolute;left:50%;top:17%;transform:translateX(-50%);text-align:center;font-size:11px;letter-spacing:4px;color:#d4dfbd;opacity:0;transition:opacity .4s;text-shadow:0 0 10px #000}
#message.show{opacity:1}
#scope{position:absolute;inset:0;display:none;background:radial-gradient(circle at center,transparent 0 28%,rgba(0,0,0,.04) 29%,rgba(0,0,0,.77) 48%,rgba(0,0,0,.96) 69%)}
#scope.on{display:block}
#scope:before,#scope:after{content:"";position:absolute;background:rgba(180,220,150,.5)}
#scope:before{left:50%;top:15%;bottom:15%;width:1px}
#scope:after{top:50%;left:15%;right:15%;height:1px}
#scopeDot{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:#d6e7b7;box-shadow:0 0 8px #d6e7b7}
#scopeData{position:absolute;left:50%;top:55%;transform:translateX(-50%);font-size:9px;letter-spacing:2px;color:#b7cba1;white-space:nowrap}
#crosshair{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:rgba(210,225,190,.7)}
#crosshair:before{left:9px;top:0;width:2px;height:20px}
#crosshair:after{left:0;top:9px;width:20px;height:2px}
.touch{position:fixed;z-index:30}
#movePad{left:18px;bottom:75px;width:125px;height:125px;border:1px solid rgba(200,230,180,.22);border-radius:50%;background:rgba(0,0,0,.1);pointer-events:none;opacity:.55;transition:opacity .12s}
#movePad.on{opacity:1}
#moveZone{left:0;bottom:0;width:48%;height:68%;pointer-events:auto;z-index:31}
#moveKnob{position:absolute;width:45px;height:45px;left:40px;top:40px;border-radius:50%;border:1px solid rgba(200,230,180,.18);background:rgba(170,210,140,.05);pointer-events:none}
#lookPad{left:0;top:0;width:100%;height:100%;pointer-events:auto;z-index:28}
.btn{position:fixed;z-index:35;width:54px;height:54px;border-radius:50%;border:1px solid rgba(205,225,185,.2);background:rgba(0,0,0,.22);color:#d2dfbd;font:10px 'Share Tech Mono';letter-spacing:1px;pointer-events:auto}
#fire{right:26px;bottom:90px;width:74px;height:74px}
#aim{right:110px;bottom:130px}
#jump{right:32px;bottom:180px}
#reload{right:115px;bottom:205px}
#torch{right:155px;bottom:75px}
@media(min-width:800px){.btn,.touch{display:none}}
#damage{position:fixed;inset:0;z-index:40;pointer-events:none;opacity:0;background:radial-gradient(circle,transparent 35%,rgba(120,20,10,.35));transition:opacity .1s}
#music{position:fixed;top:14px;right:14px;z-index:36;width:38px;height:38px;border-radius:50%;border:1px solid rgba(205,225,185,.25);background:rgba(0,0,0,.28);color:#d2dfbd;font:16px "Share Tech Mono",monospace;pointer-events:auto}
</style>

<body>
<div id="game"></div>

<div id="intro">
  <div id="introSky"></div><div id="moon"></div><div id="introJungle"></div><div id="serpentSilhouette"></div>
  <div id="date">ARCHIVE TAPE 07<br>LOCATION : NAGALOKA<br>FORMAT : VHS / 4:3 TRANSFER</div>
  <div id="rec"><i></i>REC&nbsp;&nbsp;02:17:43</div>
  <div id="introUI">
    <div id="archive">EXPEDITION RECORD / CLASSIFIED</div>
    <div id="title">NAGALOKA</div>
    <div id="subtitle">〜 REALM OF THE SERPENT 〜</div>
    <div id="tagline">SIGNAL LOCKED</div>
    <div id="signal"><div id="signalBar"></div></div>
    <button id="enter">▸ ENTER THE JUNGLE</button>
    <div id="loadingText">INITIALISING EXPEDITION TAPE...</div>
  </div>
  <div class="vhs"></div><div id="glitch"></div>
</div>

<div id="hud">
  <div id="topLeft"><div id="location">NAGALOKA • 0 m</div><div id="status">THE FOREST IS WATCHING</div></div>
  <div id="message"></div>
  <div id="vitals"><div id="vitalText">VITALITY</div><div id="hpBar"><div id="hp"></div></div></div>
  <div id="ammo"><div id="mag">12 / 48</div><small>7.62 EXPEDITION RIFLE</small></div>
  <div id="scope"><div id="scopeDot"></div><div id="scopeData">RANGE 40m • DROP 0.0 • WIND 0.0</div></div>
  <div id="crosshair"></div>
</div>
<div id="damage"></div>

<div id="movePad" class="touch"><div id="moveKnob"></div></div>
<div id="lookPad" class="touch"></div>
<div id="moveZone" class="touch"></div>
<button id="fire" class="btn">FIRE</button>
<button id="aim" class="btn">AIM</button>
<button id="jump" class="btn">JUMP</button>
<button id="reload" class="btn">RLD</button>
<button id="torch" class="btn">UV</button>
<button id="music">♪</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* NAGALOKA — THE SERPENT REMEMBERS — PERFORMANCE EDITION v2 */
const $=id=>document.getElementById(id);
const game=$('game');
let scene,camera,renderer,sky;
const clock=new THREE.Clock();
let running=false,scoped=false,player,rifle;
let creatures=[],bullets=[],vegetation=[];
let yaw=0,pitch=0,moveX=0,moveY=0,lastLookX=0,lastLookY=0,lookActive=false;
const keys={};
let hp=100,ammo=12,reserve=48,cooldown=0,recoil=0,stamina=100,uv=100,score=0,kills=0;
let boss=null,bossActive=false,bossHP=1000,quality=2;
const WATER=-3,G=9.8,BULLET_SPEED=170,WIND=.55;
const moonDirection=new THREE.Vector3(-.48,.72,-.52).normalize();
const VEC1=new THREE.Vector3(),VEC2=new THREE.Vector3(),VEC3=new THREE.Vector3();
const dummy=new THREE.Object3D();
const ZERO=new THREE.Matrix4().makeScale(0,0,0);

/* ================= INTRO ================= */
const intro=$('intro'),signalBar=$('signalBar'),loadingText=$('loadingText'),serpentSilhouette=$('serpentSilhouette'),glitch=$('glitch');
const introMessages=['CHECKING MAGNETIC COMPASS...','TUNING THE GAMELAN...','RESTORING EXPEDITION AUDIO...','GROWING THE JUNGLE...','SEARCHING FOR THE SERPENT...','THE SERPENT IS REMEMBERING.'];
let loadProgress=0;
function introLoad(){
  loadProgress=Math.min(100,loadProgress+Math.random()*2.5+.7);
  signalBar.style.width=loadProgress+'%';
  loadingText.textContent=introMessages[Math.min(introMessages.length-1,Math.floor(loadProgress/18))];
  if(loadProgress>63)serpentSilhouette.classList.add('show');
  if(Math.random()<.07){glitch.classList.remove('on');void glitch.offsetWidth;glitch.classList.add('on')}
  if(loadProgress<100)setTimeout(introLoad,55);
  else loadingText.textContent='TAPE READY • PRESS TO ENTER';
}
setTimeout(introLoad,350);
$('enter').addEventListener('click',startGame);
$('enter').addEventListener('touchstart',startGame,{passive:false});
function startGame(e){
  if(e)e.preventDefault();
  if(running)return;
  init();
  initAudio();
  intro.classList.add('hide');
  running=true;
  setTimeout(()=>showMessage('THE SERPENT IS REMEMBERING.',4200),900);
  setTimeout(()=>intro.remove(),1800);
}

/* ================= INIT ================= */
function init(){
  scene=new THREE.Scene();
  /* FIX: denser fog + shorter far plane = far fewer pixels/vertices drawn */
  scene.fog=new THREE.FogExp2(0x07120f,.02);
  camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,150);
  renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance',depth:true,stencil:false,alpha:false});
  renderer.setSize(innerWidth,innerHeight,false);
  const mobile=innerWidth<800||/iPhone|iPad|Android/i.test(navigator.userAgent);
  renderer.setPixelRatio(mobile?Math.min(devicePixelRatio,.9):Math.min(devicePixelRatio,1.35));
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.toneMapping=THREE.NoToneMapping;
  renderer.toneMappingExposure=1.18;
  game.appendChild(renderer.domElement);

  createSky();
  scene.add(new THREE.HemisphereLight(0x9bb6a4,0x0a1410,1.05));
  const moon=new THREE.DirectionalLight(0xb7cdb4,1.25);
  moon.position.copy(moonDirection).multiplyScalar(100);
  scene.add(moon);

  createTerrain();createJungle();createRuins();createNagaClues();createWater();createFireflies();createRifle();
  player={x:0,y:2,z:105,vy:0,vx:0,vz:0,sp:0,grounded:true};
  camera.position.set(player.x,player.y,player.z);
  scene.traverse(o=>{if(o.isInstancedMesh)o.frustumCulled=false});
  quality=mobile?1:2;setDensity(quality); /* phones start a notch lighter; quality rises on its own if fps allows */createCreatures();createMuzzleLight();createUVLight();createBloodSystem();

  addEventListener('resize',resize);
  setupKeyboard();setupTouch();
  clock.start();
  requestAnimationFrame(loop);
}

/* ================= SKY (follows camera, inside far plane) ================= */
function createSky(){
  const mat=new THREE.ShaderMaterial({
    side:THREE.BackSide,depthWrite:false,fog:false,
    vertexShader:`varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`varying vec3 vP;void main(){
      float h=max(vP.y,0.0);
      vec3 col=mix(vec3(.005,.018,.015),vec3(.018,.075,.065),smoothstep(0.0,.55,h));
      col=mix(col,vec3(.004,.012,.025),smoothstep(.55,1.0,h));
      col+=vec3(.55,.65,.50)*pow(max(dot(vP,normalize(vec3(-.48,.72,-.52))),0.0),350.0);
      float st=step(.997,fract(sin(dot(vP.xy,vec2(91.17,43.71)))*18317.23));
      col+=vec3(.18,.23,.18)*st*h;
      gl_FragColor=vec4(col,1.0);}`
  });
  sky=new THREE.Mesh(new THREE.SphereGeometry(120,16,10),mat);
  sky.renderOrder=-1;sky.frustumCulled=false;
  scene.add(sky);
}

/* ================= TERRAIN ================= */
function terrainHeight(x,z){
  let y=Math.sin(x*.055)*2.4+Math.cos(z*.052)*2.2+Math.sin((x+z)*.025)*3+Math.sin(x*.13+z*.07)*.65;
  y+=Math.max(0,1-Math.sqrt(x*x+z*z)/230)*1.8;
  return y;
}
function createTerrain(){
  const geo=new THREE.PlaneGeometry(460,460,100,100);
  geo.rotateX(-Math.PI/2);
  const pos=geo.attributes.position;
  for(let i=0;i<pos.count;i++)pos.setY(i,terrainHeight(pos.getX(i),pos.getZ(i)));
  geo.computeVertexNormals();
  /* FIX: Lambert instead of Standard (PBR) */
  scene.add(new THREE.Mesh(geo,new THREE.MeshLambertMaterial({color:0x17251b})));

  const moss=new THREE.InstancedMesh(new THREE.CircleGeometry(1,6),
    new THREE.MeshBasicMaterial({color:0x263d25,transparent:true,opacity:.35,depthWrite:false}),200);
  for(let i=0;i<200;i++){
    const x=(Math.random()-.5)*400,z=(Math.random()-.5)*400,s=.4+Math.random()*1.8;
    dummy.position.set(x,terrainHeight(x,z)+.08,z);
    dummy.rotation.set(-Math.PI/2,0,Math.random()*Math.PI);
    dummy.scale.set(s,s*.5,s);
    dummy.updateMatrix();moss.setMatrixAt(i,dummy.matrix);
  }
  scene.add(moss);
}
function createWater(){
  const w=new THREE.Mesh(new THREE.PlaneGeometry(260,260),
    new THREE.MeshLambertMaterial({color:0x061d1a,transparent:true,opacity:.78}));
  w.rotation.x=-Math.PI/2;w.position.y=WATER;
  scene.add(w);
}

/* ================= JUNGLE ================= */
const recycled=[],DENSITY=[.4,.7,1];
function setDensity(q){for(const m of vegetation)m.count=Math.max(1,Math.floor(m.userData.full*DENSITY[q]))}
function placeInst(m,i){
  const u=m.userData,x=u.px[i],z=u.pz[i],sc=u.ps[i];
  dummy.position.set(x,terrainHeight(x,z)+u.yo*sc,z);
  dummy.rotation.set((u.rr[i*3]-.5)*u.tilt,u.rr[i*3+1]*6.283,(u.rr[i*3+2]-.5)*u.tilt);
  dummy.scale.set(sc,sc*u.flat,sc);
  dummy.updateMatrix();m.setMatrixAt(i,dummy.matrix);
}
/* understory that follows the player: dense near you, constant cost everywhere */
function makeRecycled(geo,mat,n,yo,smin,smax,tilt,flat,hue,sat,lit){
  const m=new THREE.InstancedMesh(geo,mat,n),u=m.userData,col=new THREE.Color();
  u.n=n;u.full=n;u.yo=yo;u.tilt=tilt;u.flat=flat;u.cur=0;
  u.px=new Float32Array(n);u.pz=new Float32Array(n);u.ps=new Float32Array(n);u.rr=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const an=Math.random()*6.283,r=58*Math.sqrt(Math.random());
    u.px[i]=Math.cos(an)*r;u.pz[i]=105+Math.sin(an)*r;
    u.ps[i]=smin+Math.random()*(smax-smin);
    u.rr[i*3]=Math.random();u.rr[i*3+1]=Math.random();u.rr[i*3+2]=Math.random();
    col.setHSL(hue[0]+Math.random()*hue[1],sat,lit[0]+Math.random()*lit[1]);m.setColorAt(i,col);
    placeInst(m,i);
  }
  m.instanceMatrix.needsUpdate=true;m.instanceColor.needsUpdate=true;m.frustumCulled=false;
  scene.add(m);vegetation.push(m);recycled.push(m);
}
function updateUnderstory(){
  for(const m of recycled){
    const u=m.userData,batch=Math.min(u.n,70);
    let changed=false;
    for(let k=0;k<batch;k++){
      const i=(u.cur+k)%u.n,dx=u.px[i]-player.x,dz=u.pz[i]-player.z;
      if(dx*dx+dz*dz>3600){ /* left the 60 m bubble -> reappear in the fogged outer ring */
        const an=Math.random()*6.283,r=44+Math.random()*16;
        u.px[i]=player.x+Math.cos(an)*r;u.pz[i]=player.z+Math.sin(an)*r;
        placeInst(m,i);changed=true;
      }
    }
    u.cur=(u.cur+batch)%u.n;
    if(changed)m.instanceMatrix.needsUpdate=true;
  }
}
function createJungle(){
  const W=()=>new THREE.MeshLambertMaterial({color:0xffffff});
  const W2=()=>new THREE.MeshLambertMaterial({color:0xffffff,side:THREE.DoubleSide});
  const col=new THREE.Color();
  /* ---- 900 trees: trunk + two layered canopies, individually tinted ---- */
  const NT=900;
  const trunk=new THREE.InstancedMesh(new THREE.CylinderGeometry(.35,.65,7,6),W(),NT);
  const cA=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(3.8,0),W(),NT);
  const cB=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(2.6,0),W(),NT);
  for(let i=0;i<NT;i++){
    const an=Math.random()*Math.PI*2,r=14+Math.random()*199,x=Math.cos(an)*r,z=Math.sin(an)*r;
    if(Math.hypot(x,z-105)<34){
      col.setRGB(0,0,0);
      for(const m of [trunk,cA,cB]){m.setMatrixAt(i,ZERO);m.setColorAt(i,col)}
      continue;
    }
    const y=terrainHeight(x,z),sc=.65+Math.random()*1.8,h=sc*(.9+Math.random()*.7);
    dummy.position.set(x,y+3.5*h,z);dummy.rotation.set(0,Math.random()*3,0);dummy.scale.set(sc,h,sc);
    dummy.updateMatrix();trunk.setMatrixAt(i,dummy.matrix);
    col.setHSL(.08,.35,.07+Math.random()*.05);trunk.setColorAt(i,col);
    dummy.position.set(x,y+7*h,z);dummy.scale.setScalar(sc);
    dummy.updateMatrix();cA.setMatrixAt(i,dummy.matrix);
    col.setHSL(.32+Math.random()*.08,.55,.1+Math.random()*.07);cA.setColorAt(i,col);
    dummy.position.set(x+(Math.random()-.5)*2*sc,y+7*h+2.6*sc,z+(Math.random()-.5)*2*sc);
    dummy.rotation.set(0,Math.random()*3,0);dummy.scale.setScalar(sc*(.8+Math.random()*.4));
    dummy.updateMatrix();cB.setMatrixAt(i,dummy.matrix);
    col.setHSL(.3+Math.random()*.08,.6,.14+Math.random()*.07);cB.setColorAt(i,col);
  }
  for(const m of [trunk,cA,cB]){
    m.instanceMatrix.needsUpdate=true;m.instanceColor.needsUpdate=true;

const fireflies=[];

let fireflyTimer=0;
function updateFireflies(t){
  if(++fireflyTimer%3!==0)return;
  const tt=t*.0004;
  for(const pts of fireflies){
    const a=pts.geometry.attributes.position.array,ph=pts.userData.phase;
    for(let i=0;i<a.length;i+=3){
      const k=i*.013+ph;
      a[i]+=Math.sin(tt+k)*.002;a[i+1]+=Math.sin(t*.001+k)*.003;a[i+2]+=Math.cos(tt*.7+k)*.002;
    }
    pts.geometry.attributes.position.needsUpdate=true;
  }
}

/* ================= CREATURES (white Furby-style) ================= */
const FACE_IRIS=['#5aa8ff','#b07bff','#5fd27a'];
const faceTex=[],PI=Math.PI;
function drawCell(g,ox,oy,mode,type){ /* mode: 0 open, 1 blink, 2 angry, 3 squint(hurt) */
  g.save();g.translate(ox,oy);g.lineCap='round';g.lineJoin='round';
  const ink='#1b1b1b',lid='#e9e9ee';
  const ball=cx=>{g.beginPath();g.ellipse(cx,58,22,27,0,0,6.283)};
  const eye=(cx,o)=>{ /* o=-1 left eye, +1 right eye */
    g.strokeStyle=ink;g.lineWidth=4;
    if(mode===3){g.lineWidth=6;g.beginPath();g.moveTo(cx+o*16,38);g.lineTo(cx-o*12,58);g.lineTo(cx+o*16,76);g.stroke();return}
    g.fillStyle='#fff';ball(cx);g.fill();g.stroke();
    if(mode!==1){
      g.fillStyle=FACE_IRIS[type];g.beginPath();g.ellipse(cx,62,14,18,0,0,6.283);g.fill();
      g.fillStyle='#0d0d14';g.beginPath();g.ellipse(cx,63,8,12,0,0,6.283);g.fill();
      g.fillStyle='#fff';g.beginPath();g.arc(cx-5,54,5,0,6.283);g.fill();
      g.beginPath();g.arc(cx+5,71,2.5,0,6.283);g.fill();
    }
    if(mode===1){ /* closed eyelid */
      g.fillStyle=lid;ball(cx);g.fill();g.stroke();
      g.lineWidth=4;g.beginPath();g.arc(cx,56,14,.2*PI,.8*PI);g.stroke();
    }else if(mode===2){ /* heavy angry lid, slanted toward the centre */
      g.save();ball(cx);g.clip();
      g.fillStyle=lid;g.beginPath();g.moveTo(cx+o*26,24);g.lineTo(cx-o*26,24);g.lineTo(cx-o*26,60);g.lineTo(cx+o*26,40);g.closePath();g.fill();
      g.lineWidth=4;g.beginPath();g.moveTo(cx+o*26,40);g.lineTo(cx-o*26,60);g.stroke();
      g.restore();g.lineWidth=4;ball(cx);g.stroke();
    }
    g.lineWidth=3; /* cute lashes */
    for(let k=0;k<3;k++){g.beginPath();g.moveTo(cx+o*(18+k*2),44-k*8);g.lineTo(cx+o*(28+k*2),40-k*10);g.stroke()}
  };
  g.fillStyle='rgba(255,120,150,.4)';[12,116].forEach(x=>{g.beginPath();g.arc(x,98,9,0,6.283);g.fill()});
  eye(38,-1);eye(90,1);
  g.restore();
}
function getFaceTex(type){ /* 2x2 atlas: open / blink / angry / hurt */
  if(!faceTex[type]){
    const c=document.createElement('canvas');c.width=c.height=256;
    const g=c.getContext('2d');
    for(let m=0;m<4;m++)drawCell(g,(m&1)*128,(m>>1)*128,m,type);
    faceTex[type]=new THREE.CanvasTexture(c);
  }
  const t=faceTex[type].clone();t.needsUpdate=true;t.repeat.set(.5,.5);t.offset.set(0,.5);return t;
}
/* merge a few coloured geometries into one (keeps draw calls low) */
function mergeColored(parts){
  let n=0;for(const [g] of parts)n+=g.attributes.position.count;
  const pos=new Float32Array(n*3),nor=new Float32Array(n*3),col=new Float32Array(n*3),idx=[],c=new THREE.Color();
  let off=0;
  for(const [g,hex] of parts){
    const p=g.attributes.position;c.set(hex);
    pos.set(p.array,off*3);nor.set(g.attributes.normal.array,off*3);
    for(let i=0;i<p.count;i++){col[(off+i)*3]=c.r;col[(off+i)*3+1]=c.g;col[(off+i)*3+2]=c.b}
    if(g.index){for(let i=0;i<g.index.count;i++)idx.push(g.index.getX(i)+off)}else{for(let i=0;i<p.count;i++)idx.push(off+i)}
    off+=p.count;
  }
  const m=new THREE.BufferGeometry();
  m.setAttribute('position',new THREE.BufferAttribute(pos,3));
  m.setAttribute('normal',new THREE.BufferAttribute(nor,3));
  m.setAttribute('color',new THREE.BufferAttribute(col,3));
  m.setIndex(idx);return m;
}
const earGeo=inner=>mergeColored([
  [new THREE.ConeGeometry(.38,1.25,5).translate(0,.62,0),0xffffff],

const CG={

function mesh(geo,mat,x,y,z,parent){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);parent.add(m);return m}
function creatureModel(type){

  body.add(new THREE.Mesh(CG.face,fm));P.fm=fm;
  for(let i=0;i<2;i++){

    e.add(new THREE.Mesh(CG.ear[type],CMat.ear));body.add(e);P.ears.push(e);
    const w=new THREE.Group();w.position.set(s*1.05,.1,.1);w.userData.s=s;
    w.add(new THREE.Mesh(CG.wing,fur));body.add(w);P.wings.push(w);
    P.feet.push(mesh(CG.foot,CMat.foot,s*.45,-1.02,.35,g));
  }
  P.tuft=mesh(CG.tuft,fur,0,1.1,.25,body);P.tuft.rotation.x=.6;

  g.userData.P=P;return g;

function animateCreature(c,T,dt,moving,attack){
  const P=c.g.userData.P,ph=c.phase,kind=c.type;
  /* face: blink now and then, glare when attacking, squint when hit */
  c.blinkT-=dt;if(c.blinkT<0){c.blinkNow=.13;c.blinkT=2.2+Math.random()*3.5}
  c.blinkNow-=dt;
  const st=c.hurtT>0?3:attack?2:c.blinkNow>0?1:0;
  if(c.face!==st){c.face=st;P.fm.map.offset.set((st&1)*.5,.5-(st>>1)*.5)}
  const mv=moving?1:.15,w=T*(moving?(kind===2?6:10):2.5)+ph,sw=Math.sin(w);
  const hop=Math.abs(Math.sin(T*(kind===1?5:7)+ph));
  const k=kind===2?(moving?Math.abs(sw)*.6:0):(moving?hop:(.5+.5*Math.sin(T*2+ph))*.4); /* squash & stretch */
  P.body.scale.set(1.07-.12*k,1.05*(.92+.18*k),.95*(1.07-.12*k));
  P.body.rotation.z=Math.sin(T*1.7+ph)*(kind===1?.12:.06)+(moving?sw*.04:0);
  P.body.rotation.x=attack?.14:0;
  P.feet[0].position.set(-.45,-1.02+Math.max(0,sw)*.28*mv,.35+sw*.35*mv);
  P.feet[1].position.set(.45,-1.02+Math.max(0,-sw)*.28*mv,.35-sw*.35*mv);
  const earBase=kind===2?.85:kind===1?.15:.3; /* big one has droopy ears, stalker keeps them pricked */
  for(let i=0;i<2;i++){
    const wn=P.wings[i],s=wn.userData.s,e=P.ears[i];
    if(attack||c.leap>0)wn.rotation.z=s*(1.4+Math.sin(T*22+ph+i)*.5);        /* flapping */
    else wn.rotation.z=s*(.25+Math.sin(T*2+ph)*.06+(moving?Math.sin(w+i*PI)*.3:0));
    e.rotation.z=-s*(earBase+.15*mv)+Math.sin(T*5+ph+i)*(.1+.12*mv);
    e.rotation.x=moving?-.3*hop:0;
  }
  P.tuft.rotation.z=Math.sin(T*3+ph)*.2;
  P.beak.scale.y=attack?.7+Math.abs(Math.sin(T*16+ph))*.9:.7; /* chirping beak */
}

/* ================= INPUT ================= */
function setupKeyboard(){
  addEventListener('keydown',e=>{
    keys[e.code]=true;
    if(e.code==='KeyR')reload();
    if(e.code==='KeyC')toggleScope();
    if(e.code==='KeyF')uvFlash();
    if(e.code==='Space')jump();
    if(e.code==='KeyM')toggleMusic();
  });
  addEventListener('keyup',e=>{keys[e.code]=false});
  renderer.domElement.addEventListener('click',()=>{if(!scoped)shoot()});
  renderer.domElement.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'){lookActive=true;lastLookX=e.clientX;lastLookY=e.clientY}
  });
  addEventListener('pointerup',()=>{lookActive=false});
  addEventListener('pointermove',e=>{
    if(!lookActive||e.pointerType!=='mouse')return;
    const zf=camera.fov/70;yaw-=(e.clientX-lastLookX)*.0025*zf;
    pitch=Math.max(-1.35,Math.min(1.35,pitch-(e.clientY-lastLookY)*.002*zf));
    lastLookX=e.clientX;lastLookY=e.clientY;
  });
}
function setupTouch(){
  const pad=$('movePad'),knob=$('moveKnob'),zone=$('moveZone'),look=$('lookPad'),fb=$('fire');
  let moveId=null,lookId=null,fireId=null,lx=0,ly=0,fx=0,fy=0,cx=0,cy=0;
  const findT=(list,id)=>{for(const t of list)if(t.identifier===id)return t;return null};

  /* ---- floating left stick: appears wherever the thumb lands ---- */
  const setStick=t=>{
    let dx=t.clientX-cx,dy=t.clientY-cy;
    const max=50,len=Math.hypot(dx,dy);
    if(len>max){dx=dx/len*max;dy=dy/len*max}
    let nx=dx/max,ny=dy/max;
    const m=Math.hypot(nx,ny);
    if(m<.1){nx=0;ny=0}else{const c=Math.pow(m,1.25)/m;nx*=c;ny*=c} /* fine control at low tilt */
    moveX=nx;moveY=ny;
    knob.style.transform=`translate(${dx}px,${dy}px)`;
  };
  const endMove=()=>{moveId=null;moveX=0;moveY=0;knob.style.transform='';pad.style.left='';pad.style.top='';pad.style.bottom='';pad.classList.remove('on')};
  zone.addEventListener('touchstart',e=>{
    e.preventDefault();
    if(moveId!==null)return;
    const t=e.changedTouches[0];moveId=t.identifier;
    const L=Math.max(8,Math.min(innerWidth-133,t.clientX-62)),T=Math.max(8,Math.min(innerHeight-133,t.clientY-62));
    pad.style.left=L+'px';pad.style.top=T+'px';pad.style.bottom='auto';pad.classList.add('on');
    cx=L+62.5;cy=T+62.5;setStick(t);
  },{passive:false});
  zone.addEventListener('touchmove',e=>{e.preventDefault();const t=findT(e.touches,moveId);if(t)setStick(t)},{passive:false});
  zone.addEventListener('touchend',e=>{if(findT(e.changedTouches,moveId))endMove()});
  zone.addEventListener('touchcancel',endMove);

  /* ---- look: drag anywhere that is not the stick or a button ---- */
  look.addEventListener('touchstart',e=>{
    e.preventDefault();
    if(lookId===null){const t=e.changedTouches[0];lookId=t.identifier;lx=t.clientX;ly=t.clientY}
  },{passive:false});
  look.addEventListener('touchmove',e=>{
    e.preventDefault();
    const t=findT(e.touches,lookId);if(!t)return;
    addLook(t.clientX-lx,t.clientY-ly);lx=t.clientX;ly=t.clientY;
  },{passive:false});
  look.addEventListener('touchend',e=>{if(findT(e.changedTouches,lookId))lookId=null});
  look.addEventListener('touchcancel',()=>{lookId=null});

  /* ---- FIRE: hold to keep firing, and drag the same thumb to aim ---- */
  fb.addEventListener('touchstart',e=>{
    e.preventDefault();
    if(fireId===null){const t=e.changedTouches[0];fireId=t.identifier;fx=t.clientX;fy=t.clientY;firing=true}
  },{passive:false});
  fb.addEventListener('touchmove',e=>{
    e.preventDefault();
    const t=findT(e.touches,fireId);if(!t)return;
    addLook(t.clientX-fx,t.clientY-fy);fx=t.clientX;fy=t.clientY;
  },{passive:false});
  fb.addEventListener('touchend',e=>{if(findT(e.changedTouches,fireId)){fireId=null;firing=false}});
  fb.addEventListener('touchcancel',()=>{fireId=null;firing=false});

  [['aim',toggleScope],['jump',jump],['reload',reload],['torch',uvFlash]].forEach(([id,fn])=>{
    $(id).addEventListener('touchstart',e=>{e.preventDefault();fn()},{passive:false});
  });
}

/* ================= PLAYER ================= */
let pendYaw=0,pendPitch=0,firing=false;
function addLook(dx,dy){
  const zf=camera.fov/70,acc=1+Math.min(.7,Math.hypot(dx,dy)*.035); /* light acceleration like COD */
  pendYaw-=dx*.0046*zf*acc;pendPitch-=dy*.0036*zf*acc;
}
function applyLook(dt){
  /* look input is queued and eased in every frame, so uneven touch events never cause jitter */
  const k=1-Math.exp(-dt*32),ay=pendYaw*k,ap=pendPitch*k;
  yaw+=ay;pitch=Math.max(-1.3,Math.min(1.3,pitch+ap));pendYaw-=ay;pendPitch-=ap;
}
function updatePlayer(dt){
  applyLook(dt);
  let mx=0,mz=0;
  if(keys.KeyW)mz-=1;if(keys.KeyS)mz+=1;if(keys.KeyA)mx-=1;if(keys.KeyD)mx+=1;
  mx+=moveX;mz+=moveY;
  const len=Math.hypot(mx,mz);
  if(len>1){mx/=len;mz/=len}
  /* sprint: Shift on keyboard, or push the stick all the way out on mobile */
  const sprint=(keys.ShiftLeft||keys.ShiftRight||Math.hypot(moveX,moveY)>.93)&&stamina>0&&len>0;
  const speed=sprint?9:5;
  stamina+=sprint?-dt*16:dt*10;
  stamina=Math.max(0,Math.min(100,stamina));
  const sy=Math.sin(yaw),cy=Math.cos(yaw);
  /* smooth acceleration / braking instead of instant start-stop */
  const ac=Math.min(1,dt*(len>0?12:9));
  player.vx+=((mx*cy-mz*sy)*speed-player.vx)*ac;
  player.vz+=((mx*sy+mz*cy)*speed-player.vz)*ac;
  player.sp=Math.hypot(player.vx,player.vz);
  player.x=Math.max(-205,Math.min(205,player.x+player.vx*dt));
  player.z=Math.max(-205,Math.min(205,player.z+player.vz*dt));
  const ground=terrainHeight(player.x,player.z)+2;
  player.vy-=G*dt;player.y+=player.vy*dt;
  if(player.y<=ground){player.y=ground;player.vy=0;player.grounded=true}
  camera.position.set(player.x,player.y+Math.sin(performance.now()*(sprint?.016:.011))*.03*Math.min(1,player.sp/5),player.z);
  camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;
  const tf=scoped?24:(sprint?75:70); /* smooth zoom + slight FOV kick when sprinting */
  if(Math.abs(camera.fov-tf)>.05){camera.fov+=(tf-camera.fov)*Math.min(1,dt*8);camera.updateProjectionMatrix()}
  sky.position.copy(camera.position); /* sky follows the player */
}
function jump(){if(player&&player.grounded){player.vy=7.2;player.grounded=false}}
function toggleScope(){
  scoped=!scoped;
  $('scope').classList.toggle('on',scoped);
  camera.fov=scoped?24:70;camera.updateProjectionMatrix();
  if(rifle)rifle.visible=!scoped;
}
let scopeTimer=0;
function updateScope(dt){
  if(!scoped)return;
  scopeTimer-=dt;if(scopeTimer>0)return;scopeTimer=.08;
  const range=25+Math.hypot(camera.position.x,camera.position.z)*.25;
  const drop=Math.max(0,G*Math.pow(range/BULLET_SPEED,2)*.5),wind=WIND*range/BULLET_SPEED;
  $('scopeData').textContent=`RANGE ${range.toFixed(0)}m • DROP ${drop.toFixed(2)} • WIND ${wind.toFixed(2)}`;
}

/* ================= LIGHTS ================= */
let muzzleLight,muzzleTimer=0,uvLight,uvTimer=0;
function createMuzzleLight(){muzzleLight=new THREE.PointLight(0xffd8a0,0,10);scene.add(muzzleLight)}
function muzzleFlash(){muzzleLight.position.copy(camera.position);muzzleLight.intensity=4;muzzleTimer=.045}
function updateMuzzle(dt){if(muzzleTimer>0&&(muzzleTimer-=dt)<=0)muzzleLight.intensity=0}
function createUVLight(){uvLight=new THREE.SpotLight(0x9cdbff,0,38,Math.PI/8,.8);scene.add(uvLight,uvLight.target)}
function uvFlash(){
  if(!uvLight||uv<=0)return;
  uv-=12;
  uvLight.position.copy(camera.position);
  camera.getWorldDirection(VEC3);
  uvLight.target.position.copy(camera.position).add(VEC3.multiplyScalar(10));
  uvLight.intensity=8;uvTimer=.5;
}
function updateUV(dt){if(uvTimer>0&&(uvTimer-=dt)<=0)uvLight.intensity=0}

/* ================= SHOOTING ================= */
function shoot(){
  if(!running||cooldown>0)return;
  if(ammo<=0){showMessage('MAGAZINE EMPTY',900);return}
  ammo--;cooldown=.38;recoil=.13;updateAmmo();
  camera.getWorldDirection(VEC1);
  bullets.push({pos:camera.position.clone(),vel:VEC1.clone().multiplyScalar(BULLET_SPEED),life:3});
  muzzleFlash();
}
function updateBullets(dt){
  const SUB=3,sdt=dt/SUB;
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    let hit=false;
    b.life-=dt;
    for(let st=0;st<SUB&&!hit;st++){
      b.vel.y-=G*sdt;b.vel.x+=WIND*sdt;
      b.pos.addScaledVector(b.vel,sdt);
      for(const c of creatures){
        if(!c.alive)continue;
        const radius=c.type===2?2.5:c.type===1?1.8:1.6;
        if(c.g.position.distanceTo(b.pos)<radius){
          c.hp-=scoped?55:35;c.hit=.12;c.hurtT=.4;hit=true;
          blood(b.pos,c.type===2?16:12,b.vel);
          if(c.hp<=0)killCreature(c);
          break;
        }
      }
      if(!hit&&bossActive&&boss&&boss.position.distanceTo(b.pos)<8){
        bossHP-=scoped?55:30;blood(b.pos,14,b.vel);hit=true;
        if(bossHP<=0)killBoss();
      }
    }
    if(hit||b.life<=0)bullets.splice(i,1);
  }
}
function reload(){
  if(ammo>=12||reserve<=0)return;
  const give=Math.min(12-ammo,reserve);
  ammo+=give;reserve-=give;updateAmmo();
  showMessage('RELOADING EXPEDITION MAG',800);
}
function updateAmmo(){$('mag').textContent=`${ammo} / ${reserve}`}

/* ================= CREATURE AI ================= */
function updateCreatures(dt){
  const T=performance.now()*.001;
  for(const c of creatures){
    if(!c.alive)continue;
    c.cooldown-=dt;c.hit=Math.max(0,c.hit-dt);c.hurtT=Math.max(0,c.hurtT-dt);
    const p=c.g.position,dx=player.x-p.x,dz=player.z-p.z,dist=Math.hypot(dx,dz);
    let moving=false,attack=false;
    if(dist<95){
      const inv=1/(dist||1),nx=dx*inv,nz=dz*inv;
      const side=c.type===1?Math.sin(T+c.phase)*.45:c.type===0?Math.sin(T*2.2+c.phase)*.35:Math.sin(T*1.3+c.phase)*.25;
      let sp=c.speed,lift=0;
      if(c.type<2){ /* spirits and stalkers pounce */
        c.leapCd-=dt;
        if(c.leap>0){c.leap-=dt;sp*=2.2;lift=Math.sin((1-Math.max(0,c.leap)/.7)*Math.PI)*(c.type?1.8:2.4)}
        else if(c.leapCd<=0&&dist>8&&dist<30){c.leap=.7;c.leapCd=2.5+Math.random()*3}
        lift+=Math.abs(Math.sin(T*(c.type?5:7)+c.phase))*.35;
      }
      p.x+=(nx+side)*sp*dt;p.z+=(nz+side)*sp*dt;
      p.y=terrainHeight(p.x,p.z)+1.2+lift;
      c.g.rotation.y=Math.atan2(dx,dz);
      if(dist<2.7&&c.cooldown<=0){damagePlayer(c.damage);c.cooldown=1.2}
      moving=dist>2.7;attack=dist<4.8||c.leap>0;
    }else p.y=terrainHeight(p.x,p.z)+1+(c.type<2?Math.abs(Math.sin(T*2+c.phase))*.25:0);
    animateCreature(c,T,dt,moving,attack);
    c.g.scale.setScalar(c.base*(c.hit>0?1+c.hit*.8:1));
  }
  if(kills>=4&&!bossActive)createBoss();
}
function killCreature(c){
  c.alive=false;kills++;score+=100;
  const fm=c.g.userData.P&&c.g.userData.P.fm;if(fm){fm.map.dispose();fm.dispose()}
  showMessage(c.type===0?'SPIRIT DOWN':c.type===1?'STALKER DOWN':'NAGA SPAWN DOWN',700);
  blood(c.g.position,22);scene.remove(c.g);
  setTimeout(()=>{
    if(!running)return;
    const i=creatures.indexOf(c);
    if(i>=0)creatures.splice(i,1);
    spawnCreature(Math.floor(Math.random()*3));
  },4500);
}
function killBoss(){
  bossActive=false;
  showMessage('THE SERPENT RETURNS TO THE MIST',5000);
  blood(boss.position,100);scene.remove(boss);boss=null;score+=5000;
}
function updateBoss(dt){
  if(!bossActive||!boss)return;
  const dx=player.x-boss.position.x,dz=player.z-boss.position.z,dist=Math.hypot(dx,dz);
  if(dist<80){
    const inv=1/(dist||1);
    boss.position.x+=dx*inv*1.7*dt;boss.position.z+=dz*inv*1.7*dt;
    boss.position.y=terrainHeight(boss.position.x,boss.position.z)+4;
    boss.rotation.y=Math.atan2(dx,dz);
    if(dist<9)damagePlayer(24*dt);
  }
  const t=performance.now()*.002;
  for(let i=0;i<boss.children.length;i++){
    const ch=boss.children[i];
    if(ch.userData.seg)ch.position.y+=Math.sin(t+i)*.01;
  }
}
function damagePlayer(amount){
  hp=Math.max(0,hp-amount);
  $('hp').style.width=hp+'%';
  const d=$('damage');d.style.opacity=.75;
  setTimeout(()=>{d.style.opacity=0},120);
  if(hp<=0)gameOver();
}

/* ================= BLOOD POOL ================= */
const BLOOD_MAX=600;
let bloodMesh;const bloodData=[];
function createBloodSystem(){
  bloodMesh=new THREE.InstancedMesh(new THREE.SphereGeometry(.08,6,5),
    new THREE.MeshBasicMaterial({color:0x2a86e6,transparent:true,opacity:.92,fog:false,depthWrite:false}),BLOOD_MAX);
  bloodMesh.count=0;bloodMesh.frustumCulled=false;
  scene.add(bloodMesh);
  for(let i=0;i<BLOOD_MAX;i++)bloodData.push({active:false,life:0,x:0,y:0,z:0,vx:0,vy:0,vz:0,scale:1});
}
let bloodCursor=0;
function blood(pos,count,dir){
  if(!bloodMesh)return;
  let dx=0,dy=0,dz=0;
  if(dir){const l=Math.hypot(dir.x,dir.y,dir.z)||1;dx=dir.x/l;dy=dir.y/l;dz=dir.z/l}
  for(let i=0;i<count;i++){
    /* FIX: rotating cursor instead of scanning the whole pool for every droplet */
    let p=null;
    for(let k=0;k<BLOOD_MAX;k++){
      const q=bloodData[(bloodCursor+k)%BLOOD_MAX];
      if(!q.active){p=q;bloodCursor=(bloodCursor+k+1)%BLOOD_MAX;break}
    }
    if(!p){p=bloodData[bloodCursor];bloodCursor=(bloodCursor+1)%BLOOD_MAX}
    p.active=true;p.life=.3+Math.random()*.45;
    p.x=pos.x+(Math.random()-.5)*.15;p.y=pos.y+(Math.random()-.5)*.15;p.z=pos.z+(Math.random()-.5)*.15;
    if(dir){ /* fine mist sprayed along the bullet's path */
      const sp=3+Math.random()*5;
      p.vx=dx*sp+(Math.random()-.5)*1.6;p.vy=dy*sp+Math.random()*1.2;p.vz=dz*sp+(Math.random()-.5)*1.6;
    }else{p.vx=(Math.random()-.5)*4.5;p.vy=1+Math.random()*3;p.vz=(Math.random()-.5)*4.5}
    const puff=Math.random()<.15; /* a few larger soft puffs make the spray read as mist */
    if(puff){p.life*=.8;p.vx*=.45;p.vy*=.45;p.vz*=.45}
    p.scale=puff?1.2+Math.random()*.9:.55+Math.random()*.8;
  }
}
function updateBlood(dt){
  if(!bloodMesh)return;
  let n=0;
  for(let i=0;i<BLOOD_MAX;i++){
    const p=bloodData[i];
    if(!p.active)continue;
    p.life-=dt;
    if(p.life<=0){p.active=false;continue}
    const k=Math.max(0,1-2.5*dt);p.vx*=k;p.vz*=k;p.vy=p.vy*k-G*.5*dt; /* air drag = soft mist */
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;
    dummy.position.set(p.x,p.y,p.z);
    dummy.scale.setScalar(p.scale*Math.min(1,p.life*2));
    dummy.rotation.set(p.vy,p.vx,p.vz);
    dummy.updateMatrix();bloodMesh.setMatrixAt(n++,dummy.matrix);
  }
  bloodMesh.count=n;
  if(n)bloodMesh.instanceMatrix.needsUpdate=true;
}

/* ================= GAMELAN SOUNDTRACK (procedural WebAudio, no files) ================= */
let AC=null,master=null,wetIn=null,musicOn=true,nextBeat=0,beatNo=0,curGatra=[0,1,2,1];
const PELOG=[0,120,270,670,785];           /* pelog-style scale, cents */
const ROOT=185;
const hz=d=>ROOT*Math.pow(2,(PELOG[((d%5)+5)%5]+1200*Math.floor(d/5))/1200);
const BAR=[[1,1],[2.76,.28],[5.4,.1]];     /* metal bar partials */
const GONG=[[1,1],[1.5,.5],[2.02,.35],[2.67,.2]];
const GATRA=[[0,1,2,1],[2,3,2,1],[1,2,3,4],[4,3,2,0],[0,2,1,0],[3,2,1,2]];
function initAudio(){
  if(AC)return;
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.setValueAtTime(0,AC.currentTime);
    master.gain.linearRampToValueAtTime(musicOn?.55:0,AC.currentTime+4);
    const comp=AC.createDynamicsCompressor();
    master.connect(comp);comp.connect(AC.destination);
    wetIn=AC.createGain();wetIn.gain.value=.35;
    const d=AC.createDelay(1),fb=AC.createGain(),lp=AC.createBiquadFilter();
    d.delayTime.value=.42;fb.gain.value=.45;lp.type='lowpass';lp.frequency.value=2400;
    wetIn.connect(d);d.connect(lp);lp.connect(fb);fb.connect(d);lp.connect(master);
  }catch(e){AC=null;return}
  nextBeat=AC.currentTime+.3;
  setInterval(scheduleMusic,120);
  /* iOS only unlocks audio on touchend/click, so retry on every gesture */
  ['touchend','click','pointerup','keydown'].forEach(ev=>addEventListener(ev,unlockAudio,{passive:true}));
  document.addEventListener('visibilitychange',()=>{if(AC){document.hidden?AC.suspend():AC.resume()}});
}
function unlockAudio(){if(AC&&AC.state!=='running'&&!document.hidden)AC.resume()}
function strike(f,t,v,dec,parts){
  const g=AC.createGain();
  g.gain.setValueAtTime(.0001,t);
  g.gain.linearRampToValueAtTime(v,t+.006);
  g.gain.exponentialRampToValueAtTime(.0001,t+dec);
  g.connect(master);g.connect(wetIn);
  for(const [r,a] of (parts||BAR)){
    const o=AC.createOscillator(),pg=AC.createGain();
    o.frequency.value=f*r;pg.gain.value=a;
    o.connect(pg);pg.connect(g);o.start(t);o.stop(t+dec+.05);
  }
}
function playBeat(t,beatLen){
  const i=beatNo%4,bar=Math.floor(beatNo/4)%8;
  if(i===0)curGatra=bar===7?[3,2,1,0]:GATRA[(Math.random()*GATRA.length)|0];
  const d=curGatra[i];
  strike(hz(d+5),t,.15,1.8);                                   /* saron (balungan) */
  if(bar%2===1||bossActive){strike(hz(d+10),t,.05,.5);strike(hz(d+10),t+beatLen/2,.04,.5)} /* peking */
  if(Math.random()<.55)strike(hz(d+5+[-1,1,2,3][(Math.random()*4)|0]),t+beatLen*.5,.06,1.2); /* bonang ornament */
  if(i===2)strike(hz(d),t,.1,2.4);                             /* kenong */
  if(beatNo%8===4)strike(hz(d-5),t,.12,3,GONG);                /* kempul */
  if(beatNo%32===0)strike(hz(-5),t,.22,8,GONG);                /* gong ageng */
  beatNo++;
}
function scheduleMusic(){
  if(!AC||AC.state!=='running')return;
  if(nextBeat<AC.currentTime-.1)nextBeat=AC.currentTime+.1;
  while(nextBeat<AC.currentTime+.35){
    const bl=bossActive?.55:.75;           /* the tempo quickens when the serpent wakes */
    playBeat(nextBeat,bl);nextBeat+=bl;
  }
}
function toggleMusic(){
  if(!AC)initAudio();
  musicOn=!musicOn;
  if(master)master.gain.setTargetAtTime(musicOn?.55:0,AC.currentTime,.1);
  $('music').textContent=musicOn?'♪':'✕';
}
$('music').addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();toggleMusic()});

/* ================= MESSAGE / GAME OVER ================= */
let messageTimer;
function showMessage(text,time=1500){
  const el=$('message');
  el.textContent=text;el.classList.add('show');
  clearTimeout(messageTimer);
  messageTimer=setTimeout(()=>el.classList.remove('show'),time);
}
function gameOver(){
  if(!running)return;
  running=false;
  if(master)master.gain.setTargetAtTime(0,AC.currentTime,.6);
  showMessage('THE JUNGLE HAS CLAIMED YOU',999999);
  setTimeout(()=>location.reload(),3500);
}

/* ================= ADAPTIVE QUALITY =================
   FIX 1: receives RAW frame time (the clamped dt made fps look like >=30 forever)
   FIX 2: only steps pixel ratio DOWN quickly; steps UP rarely (setPixelRatio reallocates the framebuffer) */
let frameCounter=0,qualityTimer=0,lastRatioChange=0;
function adaptiveQuality(rawDt){
  frameCounter++;qualityTimer+=rawDt;
  if(qualityTimer<2.5)return;
  const fps=frameCounter/qualityTimer;
  frameCounter=0;qualityTimer=0;
  $('status').textContent=`FPS ${fps.toFixed(0)} • Q${quality}`;
  const now=performance.now();
  if(fps<40&&quality>0){
    quality--;
    renderer.setPixelRatio(Math.max(.6,renderer.getPixelRatio()-.15));
    lastRatioChange=now;
    setDensity(quality);
  }else if(fps>55&&quality<2&&now-lastRatioChange>20000){
    quality++;
    renderer.setPixelRatio(Math.min(1.2,renderer.getPixelRatio()+.1));
    lastRatioChange=now;
    setDensity(quality);
  }
}

/* ================= MAIN LOOP ================= */
let lastDist=-1;
function loop(){
  requestAnimationFrame(loop);
  if(!running)return;
  const raw=clock.getDelta();
  const dt=Math.min(.033,raw);
  const t=performance.now();
  cooldown=Math.max(0,cooldown-dt);
  if(firing)shoot(); /* hold FIRE to keep shooting */
  recoil*=.84;
  updatePlayer(dt);updateUnderstory();updateCreatures(dt);updateBoss(dt);updateBullets(dt);updateBlood(dt);
  updateFireflies(t);updateScope(dt);updateMuzzle(dt);updateUV(dt);
  adaptiveQuality(raw);
  if(rifle){const bs=rifle.userData.base;rifle.rotation.x=-recoil*1.4;const mk=Math.min(1,player.sp/5);rifle.position.set(bs[0]+Math.sin(t*.006)*.012*mk,bs[1]+Math.abs(Math.cos(t*.006))*.012*mk,bs[2]+recoil*.8)}
  /* FIX: only touch the DOM when the value changes */
  const dist=Math.round(Math.hypot(player.x,player.z));
  if(dist!==lastDist){lastDist=dist;$('location').textContent=`NAGALOKA • ${dist} m`}
  renderer.render(scene,camera);
}
function resize(){
  if(!camera||!renderer)return;
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight,false);
}
